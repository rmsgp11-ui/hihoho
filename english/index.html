<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>영어교실</title>
<meta name="theme-color" content="#ffc23a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="../config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: 초등학생이 매일 여는 다정한 영어 교실, 군더더기 없이
   IDEA: 도장을 모으는 101일 출석부 + 단어 카드 + 문장 퍼즐
   PICTURE: 오늘의 수업 카드와 101칸 여정 지도, 문제 화면은 큰 카드 하나
   COLOUR and TYPE: 햇살 노랑 바탕, 남색 잉크, 파랑 보조, 코랄 강조 / Jua + Fredoka
   LAYOUT: 한 줄 세로 흐름, 폰 우선, 최대 640px */
:root{color-scheme:light dark;--bg:light-dark(#fff1bd,#15182a);--card:light-dark(#fff,#232741);--ink:light-dark(#1d2340,#f3efe2);--mut:light-dark(#585d7d,#aeb2cb);--blue:light-dark(#2f5bff,#86a2ff);--coral:light-dark(#ff4f5a,#ff7d85);--sun:#ffc23a;--ok:light-dark(#18924f,#55d48f);--line:light-dark(#1d2340,#05060f);--soft:light-dark(#eef2ff,#2d3252);--dim:light-dark(#efe3b4,#2b2f4a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Jua,system-ui,sans-serif;overflow-x:clip;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:640px;margin:0 auto;padding:20px max(4vw,16px) 48px}
.en{font-family:Fredoka,system-ui,sans-serif;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.card{background:var(--card);border:2.5px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:18px}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
header svg{flex:none;width:60px;height:60px}
h1{font-size:clamp(30px,8vw,40px);line-height:1.05;margin:0;font-weight:400;text-wrap:balance}
.sub{color:var(--mut);font-size:15px;margin:4px 0 0}
.total{margin-left:auto;text-align:center;font-size:14px;color:var(--mut);flex:none}
.total b{display:block;font-size:26px;color:var(--ink);font-weight:400}
.who{display:block;width:100%;min-height:44px;margin:0 0 12px;border:2px dashed var(--line);border-radius:14px;background:none;font-size:16px;color:var(--mut)}
.who b{color:var(--ink);font-weight:400}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 18px;background:var(--card);border:2.5px solid var(--line);border-radius:18px;padding:5px}
.tabs button{min-height:46px;border:0;border-radius:13px;background:none;font-size:17px}
.tabs .on{background:var(--blue);color:#fff}
.lesson .dayt{font-size:46px;margin:0 0 12px;font-weight:400;line-height:1.05}
.steps{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:38px minmax(0,1fr);column-gap:12px;align-items:center;counter-increment:s}
.steps li:before{content:counter(s);grid-row:span 2;width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;border:2px solid var(--line)}
.steps b{font-weight:400;font-size:19px;line-height:1.2}.steps span{font-size:14px;color:var(--mut);line-height:1.3}
.lvh{margin:22px 0 10px;font-size:19px;font-weight:400}
.daymap{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.daymap i{aspect-ratio:1;border-radius:6px;background:var(--dim);font-style:normal;font-size:11px;display:grid;place-items:center;color:var(--mut)}
.daymap .dn{background:var(--sun);color:#1d2340}.daymap .cur{background:var(--coral);color:#fff;outline:2px solid var(--line)}
.note{margin-top:22px;font-size:15px;color:var(--mut)}.note b{color:var(--ink);font-weight:400}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{border:2.5px solid var(--line);border-radius:14px;min-width:44px;height:44px;font-size:18px;padding:0 12px;background:var(--card);flex:none}
.top h2{font-size:21px;margin:0;font-weight:400;line-height:1.2}
.chips{display:flex;gap:6px;margin:0 0 12px}.chips span{flex:1;text-align:center;font-size:13px;padding:5px 0;border-radius:10px;background:var(--dim);color:var(--mut)}
.chips .now{background:var(--blue);color:#fff}.chips .ok{background:var(--sun);color:#1d2340}
.rule{background:var(--soft);border-radius:14px;padding:12px 14px;margin:0 0 16px;font-size:16px}
.rule b{color:var(--coral);font-weight:400}
.pats{display:grid;gap:10px;margin-bottom:16px}
.pat{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:12px 14px;min-height:56px;font-size:19px}
.pat b,.spk-en b{font-weight:600;color:var(--coral);text-decoration:underline 3px;text-underline-offset:4px}
.pat small{display:block;font-family:Jua,sans-serif;font-size:14px;color:var(--mut)}
.spk{flex:none;width:36px;height:36px;border-radius:50%;background:var(--blue);display:grid;place-items:center}
.spk svg{width:18px;height:18px;fill:#fff}
.big{display:block;width:100%;min-height:56px;border:2.5px solid var(--line);border-radius:18px;background:var(--coral);color:#fff;font-size:21px;box-shadow:0 5px 0 var(--line);margin-top:4px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.big.alt{background:var(--card);color:var(--ink)}
.link{display:block;margin:12px auto 0;background:none;border:0;color:var(--mut);text-decoration:underline;font-size:14px;min-height:44px}
.bar{height:12px;border-radius:8px;background:var(--dim);overflow:hidden;margin-bottom:14px;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.ask{font-size:18px;margin:0 0 12px}.ask small{display:block;color:var(--mut);font-size:14px}
.sent{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px}
.tok{min-height:48px;min-width:44px;padding:4px 14px;border:2.5px solid var(--line);border-radius:14px;background:var(--soft);font-family:Fredoka,sans-serif;font-weight:500;font-size:22px}
.tok.bad{background:var(--coral);color:#fff;text-decoration:line-through}.tok.fix{background:var(--ok);color:#fff}
.tok.shake{animation:sh .35s}
.pun{font-family:Fredoka,sans-serif;font-size:24px}
.hint{font-size:16px;color:var(--mut);margin:-4px 0 12px}
.opts{display:grid;gap:10px}
.opt{min-height:52px;text-align:left;padding:10px 16px;border:2.5px solid var(--line);border-radius:16px;background:var(--card);font-size:18px}
.opt.en{font-size:21px}.opt.no{opacity:.45;text-decoration:line-through}
.opt.right{background:var(--ok);color:#fff;opacity:1;text-decoration:none}.opt.wrongc{background:var(--coral);color:#fff;opacity:1}
.none{margin-top:6px;min-height:48px;border:2.5px dashed var(--line);border-radius:14px;background:none;width:100%;font-size:17px}
.msg{min-height:26px;margin:14px 0 0;font-size:17px}.msg.good{color:var(--ok)}.msg.oops{color:var(--coral)}
.say{display:flex;align-items:center;gap:10px;font-size:21px;background:var(--soft);border:none;border-radius:14px;padding:10px 14px;text-align:left;width:100%}
.wcard{text-align:center}
.wbig{display:block;width:100%;border:0;background:none;font-family:Fredoka,sans-serif;font-weight:600;font-size:clamp(44px,14vw,72px);line-height:1.1;padding:16px 0 6px;overflow-wrap:anywhere}
.mean{font-size:24px;min-height:38px;margin:4px 0 16px}.mean.hid{color:var(--mut);font-size:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sbtn{min-height:50px;border:2.5px solid var(--line);border-radius:14px;background:var(--soft);font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.rep{width:100%;min-height:50px;border:2.5px dashed var(--line);border-radius:14px;background:none;font-size:17px}
.rep.full{border-style:solid;background:var(--ok);color:#fff}
.spkbig{display:grid;place-items:center;width:110px;height:110px;margin:6px auto 18px;border-radius:50%;background:var(--blue);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.spkbig .spk{width:auto;height:auto;background:none}.spkbig svg{width:54px;height:54px}
.meanbig{text-align:center;font-size:28px;margin:6px 0 16px;line-height:1.3}
.srow{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;font-size:22px}
.srow button{border:0;background:none;padding:0}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px}
.slot{width:34px;height:46px;border-bottom:4px solid var(--line);display:grid;place-items:center;font-family:Fredoka,sans-serif;font-size:28px;font-weight:600}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.tile{min-width:48px;height:52px;border:2.5px solid var(--line);border-radius:12px;background:var(--sun);color:#1d2340;font-size:26px;box-shadow:0 3px 0 var(--line);padding:0 12px}
.tile.word{font-size:20px}
.tile:disabled{opacity:.25;box-shadow:none}
.build{min-height:64px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px;border:2.5px dashed var(--line);border-radius:14px;margin-bottom:14px}
.chip{background:var(--soft);border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-size:20px}
.spk-en{font-size:clamp(26px,7vw,34px);line-height:1.3;margin:8px 0 6px}
.res{text-align:center}
.res .stars{justify-content:center;margin:10px 0}.res .stars svg{width:48px;height:48px}
.res h2{font-size:30px;margin:6px 0 0;font-weight:400}
.stars{flex:none;display:flex;gap:1px}.stars svg{width:20px;height:20px;fill:var(--dim)}.stars svg.on{fill:var(--sun);stroke:var(--line);stroke-width:1.2}
.stamp{display:block;width:150px;height:150px;margin:0 auto 6px}
.wlist{display:grid;gap:8px;margin:16px 0;text-align:left}
.wlist>div,.wlist button{display:flex;gap:10px;align-items:center;border:0;border-radius:14px;background:var(--soft);padding:10px 14px;text-align:left;font-size:16px;width:100%}
.wlist b{font-family:Fredoka,sans-serif;font-weight:600;font-size:19px;color:var(--ok)}.wlist s{color:var(--coral)}
.row{display:grid;gap:12px}
.list{display:grid;gap:12px}
.stage{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2.5px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:10px 14px;min-height:68px;width:100%}
.stage.now{background:light-dark(#ffe6a0,#3a3352)}
.num{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:19px;border:2.5px solid var(--line)}
.st{flex:1;display:grid}.tt{font-size:17px;line-height:1.25}.ex{font-size:14px;color:var(--mut)}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pack{position:relative;text-align:left;border:2.5px solid var(--line);border-radius:16px;background:var(--card);padding:10px 12px;min-height:64px;box-shadow:0 4px 0 var(--line);display:grid;gap:7px}
.pack.now{background:light-dark(#ffe6a0,#3a3352)}
.dots{display:flex;gap:3px}.dots i{flex:1;height:8px;border-radius:4px;background:var(--dim)}
.dots .b1,.dots .b2,.dots .b3{background:var(--blue)}.dots .b4,.dots .b5,.dots .b6{background:var(--sun)}
.legend{font-size:14px;color:var(--mut);display:flex;flex-wrap:wrap;gap:12px;margin:0 0 12px}
.legend i{display:inline-block;width:18px;height:8px;border-radius:4px;margin-right:4px;vertical-align:middle;background:var(--dim)}.legend .b1{background:var(--blue)}.legend .b4{background:var(--sun)}
.frm{display:flex;gap:8px}.frm input{flex:1;min-height:50px;font:16px Jua,system-ui,sans-serif;padding:0 14px;border:2.5px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink)}.frm .sbtn{padding:0 18px}
textarea{width:100%;min-height:280px;font:15px/1.5 system-ui,sans-serif;padding:12px;border:2.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
.mic{display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px auto 6px;border:0;background:none;font-size:17px}
.mic .ring{display:grid;place-items:center;width:104px;height:104px;border-radius:50%;background:var(--coral);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.mic svg{width:46px;height:46px;fill:#fff}
.mic.on .ring{background:var(--ok);animation:pulse 1.2s infinite}
.mic:disabled .ring{background:var(--sun)}.mic:disabled{opacity:1;cursor:default}
.heard{min-height:30px;font-size:20px;color:var(--mut);margin:6px 0 2px}
.score{font-family:Fredoka,sans-serif;font-size:22px;margin:4px 0}.score .hw{color:var(--ok)}.score .mw{color:var(--coral);text-decoration:underline 2px}
.big:disabled{opacity:.45;box-shadow:none;cursor:default}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.6) rotate(-20deg);opacity:0}}
.stamp{animation:pop .45s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:380px){.tok{font-size:20px;padding:4px 10px}.tabs button{font-size:15px}}
</style>
</head>

  }else if(reason==='rate_limited'){T.cls='oops';T.msg='잠깐 뒤에 다시 눌러 주세요.'}

}

/* ---------- 문제 엔진 ---------- */
function runStart(q,o){R={q:[...q],qi:0,miss:{},keys:new Set(),title:o.title,onDone:o.onDone,noSrs:o.noSrs,tk:0};rq()}
function rq(){
  if(R.qi>=R.q.length)return runEnd();
  const it=R.q[R.qi];R.ans=null;R.typed=[];R.st='w';R.gone=[];R.fmiss=false;R.msg='';R.cls='';R.shake=null;
  if(it.w){
    const w=it.w;
    if(it.t==='S'){const Lt=w.w.split(''),ab='abcdefghijklmnoprstuwy',d=[];while(d.length<2){const c=ab[Math.floor(Math.random()*ab.length)];if(!Lt.includes(c)&&!d.includes(c))d.push(c)}R.tiles=mix([...Lt,...d])}
    else{const key=it.t==='L'?'m':'w',seen=new Set([w[key]]),o=[w[key]];
      for(const x of mix(WORDS)){if(o.length>=4)break;if(!seen.has(x[key])&&x.m!==w.m&&x.w.toLowerCase()!==w.w.toLowerCase()){seen.add(x[key]);o.push(x[key])}}
      R.opts=mix(o);R.right=w[key]}
  }else if(it.t==='F'){const q=GU[it.u].f[it.i];R.oo=shuf(q[2].length);R.wo=shuf(3)}
  else{const o=GU[it.u].o[it.i],sp=split(o[1]);R.target=sp.w;R.p=sp.p;R.tiles=mix([...sp.w,o[2]])}
  rr();
  if(it.w&&it.t!=='M')sayW(it.w.w);
}
function rr(){
  const it=R.q[R.qi];
  const b=it.w?rW(it):it.t==='F'?rF(it):rO(it);
  app.innerHTML=top(R.title)+`<div class="bar"><i style="width:${Math.min(R.qi/R.q.length,1)*100}%"></i></div><div class="card">${b}</div>`;
  R.shake=null;
}
function rW(it){
  const w=it.w,A=R.ans;let b;
  if(it.t==='S'){
    b=`<p class="ask">듣고 철자를 맞춰요</p><div class="srow"><button data-a="rsay" aria-label="다시 듣기">${SPK}</button><span>${w.m}</span></div>
    <div class="slots">${w.w.split('').map((c,i)=>`<span class="slot">${A&&!A.ok?c:(R.typed[i]!=null?R.tiles[R.typed[i]]:'')}</span>`).join('')}</div>
    ${A?'':`<div class="tiles">${R.tiles.map((c,i)=>`<button class="tile en" data-a="wtile" data-v="${i}" ${R.typed.includes(i)?'disabled':''}>${c}</button>`).join('')}</div><button class="none" data-a="wdel">한 글자 지우기</button>`}`;
  }else{
    b=(it.t==='L'?`<p class="ask">듣고 뜻을 골라요</p><button class="spkbig" data-a="rsay" aria-label="다시 듣기">${SPK}</button>`:`<p class="ask">이 뜻의 영어 단어는?</p><p class="meanbig">${w.m}</p>`)+
    `<div class="opts">${R.opts.map((o,i)=>`<button class="opt ${it.t==='M'?'en':''} ${A?(o===R.right?'right':(A.v===i?'wrongc':'no')):''}" data-a="wopt" data-v="${i}">${o}</button>`).join('')}</div>`;
  }
  if(A)b+=`<p class="msg ${A.ok?'good':'oops'}">${A.ok?'정답!':'정답은 <span class="en">'+w.w+'</span> ('+w.m+'). 이 단어는 뒤에 한 번 더 나와요.'}</p>${A.ok?'':'<button class="big" data-a="radv">다음</button>'}`;
  return b;
}
function rF(it){
  const q=GU[it.u].f[it.i],{w,p}=split(q[0]),st=R.st;
  const toks=w.map((t,i)=>{
    const hit=i===q[1];let c='tok';
    if(hit&&st==='fix')c+=' bad';if(hit&&(st==='why'||st==='done'))c+=' fix';if(R.shake===i)c+=' shake';
    const txt=hit&&(st==='why'||st==='done')?q[2][0]:t;
    return st==='w'?`<button class="${c}" data-a="ftok" data-v="${i}">${txt}</button>`:`<span class="${c}">${txt}</span>`;
  }).join('')+`<span class="pun">${p}</span>`;
  const hint=q[4]?`<p class="hint">${q[4]}</p>`:'';
  let b;
  if(st==='w')b=`<p class="ask">틀린 단어를 눌러 봐요<small>틀린 곳이 없을 수도 있어요!</small></p><div class="sent">${toks}</div>${hint}<button class="none" data-a="fnone">틀린 곳 없어요</button>`;
  else if(st==='fix')b=`<p class="ask">맞게 고치면?</p><div class="sent">${toks}</div>${hint}<div class="opts">${R.oo.map(k=>`<button class="opt en ${R.gone.includes('o'+k)?'no':''}" data-a="fopt" data-v="${k}">${q[2][k]}</button>`).join('')}</div>`;
  else if(st==='why')b=`<p class="ask">왜 그럴까?</p><div class="sent">${toks}</div>${hint}<div class="opts">${R.wo.map(k=>`<button class="opt ${R.gone.includes('w'+k)?'no':''}" data-a="fwhy" data-v="${k}">${q[3][k]}</button>`).join('')}</div>`;
  else b=`<p class="ask">${R.fmiss?'다시 해서 맞혔어요!':'한 번에 맞혔어요!'}</p><button class="say" data-a="fsay">${SPK}<span class="en">${fixed(q)}</span></button><p class="rule" style="margin:12px 0">${q[3][0]}</p><button class="big" data-a="radv">다음</button>`;
  return b+(st==='done'?'':`<p class="msg ${R.cls}" role="status">${R.msg}</p>`);
}
function rO(it){
  const o=GU[it.u].o[it.i],A=R.ans,full=R.typed.length===R.target.length;
  let b=`<p class="ask">우리말에 맞게 영어 문장을 만들어요<small>함정 단어가 하나 숨어 있어요!</small></p><p class="meanbig">${o[0]}</p>

  if(!A)b+=`<div class="tiles">${R.tiles.map((c,i)=>`<button class="tile word en" data-a="otile" data-v="${i}" ${R.typed.includes(i)?'disabled':''}>${c}</button>`).join('')}</div><button class="none" data-a="odel">한 칸 지우기</button>`;
  else b+=`<p class="msg ${A.ok?'good':'oops'}">${A.ok?'완벽해요!':'정답 문장을 보고 소리 내어 읽어 봐요. 뒤에 한 번 더 나와요.'}</p><button class="say" data-a="osay">${SPK}<span class="en">${o[1]}</span></button><button class="big" data-a="radv" style="margin-top:12px">다음</button>`;
  return b;
}
function mark(it,ok){S.t[it.t][ok?0:1]++;const k=ikey(it);R.keys.add(k);if(!ok)R.miss[k]=(R.miss[k]||0)+1}

function good(m){R.cls='good';R.msg=m}
function wanswer(ok){
  const it=R.q[R.qi];R.ans.ok=ok;mark(it,ok);if(!ok)R.q.push(it);

function runEnd(){
  const ks=[...R.keys];if(!R.noSrs)ks.forEach(k=>srs(k,R.miss[k]||0));save();
  const sum={ok:ks.filter(k=>!R.miss[k]).length,n:ks.length,miss:ks.filter(k=>R.miss[k])},fn=R.onDone;R=null;fn(sum);
}

  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case 'home':return home();
    case 'tab':S.tab=v;save();return home();
    case 'who':return who();
    case 'pick':M.cur=v;saveM();loadS();return home();
    case 'padd':{const n=nm(document.getElementById('nn').value);if(!n)return who('이름을 적어 주세요.');const id='p'+Date.now();M.list.push({id,name:n});M.cur=id;saveM();loadS();return home()}
    case 'pren':{const n=nm(document.getElementById('rn').value);if(!n)return who('이름을 적어 주세요.');me().name=n;saveM();return who('이름을 바꿨어요.')}
    case 'pday':{const n=Math.max(1,Math.min(TOTAL,parseInt(document.getElementById('pd').value,10)||1));S.c.day=n;S.c.extra=true;save();return who(`${n}일차로 바꿨어요.`)}
    case 'report':return report();
    case 'copy':{const ta=document.getElementById('rep'),cm=document.getElementById('cm');const sel=()=>{ta.focus();ta.select();cm.textContent='글자가 모두 선택됐어요. 길게 눌러 복사해 주세요.'};
      try{navigator.clipboard.writeText(ta.value).then(()=>{cm.textContent='복사됐어요! 대화창에 붙여넣어 주세요.'},sel)}catch(err){sel()}return}
    case 'lstart':return lstart(false);
    case 'revonly':return lstart(true);
    case 'unlock':S.c.extra=true;save();return home();
    case 'retry':return RT&&RT();
    case 'wpack':return wpack(+v);
    case 'gunit':return gunit(+v);
    case 'ksay':return sayW(v);
    case 'csay':return sayW(C.ws[C.i].w);
    case 'cshow':C.show=true;sayW(C.ws[C.i].w);return card();
    case 'crep':C.rep++;sayW(C.ws[C.i].w);return card();
    case 'cnext':{if(!micOk(C))return;try{DICT&&DICT.active()&&DICT.stop()}catch(e){}clearTimeout(C.tm);
      if(C.i+1<C.ws.length){C.i++;cReset();card();return sayW(C.ws[C.i].w)}const f=C.onDone;C=null;return f()}
    case 'psay':return say(plain(GU[G.u].p[+v][0]));
    case 'gnext':{const f=G.onDone;G=null;return f()}
    case 'ssay':return say(plain(SP.ss[SP.i][0]));
    case 'sslow':return say(plain(SP.ss[SP.i][0]),.55);
    case 'srep':SP.rep++;say(plain(SP.ss[SP.i][0]));return speak();
    case 'mic':{const T=micT();if(!DICT||!T||T.pass)return;
      if(DICT.active()){DICT.stop().catch(()=>{});return}
      try{speechSynthesis.cancel()}catch(e){}
      T.heard='';T.part='';T.res=null;T.msg='';T.lock=false;
      DICT.start(NOLANG?undefined:{language:'en'}).catch(err=>{const T=micT();if(!T)return;const c=err&&err.code;
        if(c==='unavailable'&&!NOLANG){NOLANG=true;T.msg='한 번 더 눌러 주세요.';T.cls='oops'}
        else if(c==='not_granted'||c==='unavailable'){NOMIC=true;T.cls='oops';T.msg='음성 확인을 쓸 수 없어서 버튼으로 할게요.'}
        else if(c==='dismissed'){T.cls='oops';T.msg='마이크를 쓰려면 허락을 눌러 주세요.'}
        micDraw()});
      return}
    case 'snext':{if(!micOk(SP))return;
      try{DICT&&DICT.active()&&DICT.stop()}catch(e){}clearTimeout(SP.tm);
      if(SP.i+1<SP.ss.length){SP.i++;spReset();speak();return say(plain(SP.ss[SP.i][0]))}SP=null;return nextStep()}
  }
  if(!R)return;
  const it=R.q[R.qi];
  switch(a){
    case 'rsay':return sayW(it.w.w);
    case 'radv':return radv();
    case 'wopt':if(R.ans)return;R.ans={v:+v};return wanswer(R.opts[+v]===R.right);
    case 'wtile':{if(R.ans)return;const i=+v;if(R.typed.includes(i))return;R.typed.push(i);const w=it.w.w;
      if(R.typed.length===w.length){R.ans={};return wanswer(R.typed.map(j=>R.tiles[j]).join('')===w)}return rr()}
    case 'wdel':R.typed.pop();return rr();
    case 'otile':{if(R.ans)return;const i=+v;if(R.typed.includes(i))return;R.typed.push(i);
      if(R.typed.length===R.target.length){const ok=R.typed.map(j=>R.tiles[j]).join(' ')===R.target.join(' ');R.ans={ok};mark(it,ok);if(!ok)R.q.push(it);say(GU[it.u].o[it.i][1])}return rr()}
    case 'odel':R.typed.pop();return rr();
    case 'osay':return say(GU[it.u].o[it.i][1]);
    case 'fsay':return say(fixed(GU[it.u].f[it.i]));
  }
  if(it.t!=='F')return;
  const q=GU[it.u].f[it.i];
  if(a==='ftok'){if(+v===q[1]){good('찾았다! 이제 고쳐 볼까?');R.st='fix'}else{oops(q[1]<0?'이 단어는 맞아요. 다른 곳은 어때요?':'거기는 맞아요. 규칙을 떠올려 봐요: '+plain(GU[it.u].r));R.shake=+v}}
  else if(a==='fnone'){if(q[1]<0){good('맞아요, 틀린 곳이 없는 문장이에요! 그럼 왜 맞을까?');R.st='why'}else oops('틀린 단어가 하나 숨어 있어요. 다시 찾아봐요!')}
  else if(a==='fopt'){if(+v===0){good('정답! 그런데 왜 그럴까?');R.st='why'}else{oops('음, 그건 아니에요. 다시 골라 봐요!');R.gone.push('o'+v)}}
  else if(a==='fwhy'){if(+v===0){R.st='done';mark(it,!R.fmiss);say(fixed(q))}else{oops('다시 생각해 봐요!');R.gone.push('w'+v)}}
  rr();
});
/* ---------- 우리가족 계정 연결: 기록 저장 + 끝내면 오늘 약속 자동 체크 ---------- */
let writing=false,again=false,pushT=null;
function pushFB(){if(!FB||!FB.user||!FB.ref)return;clearTimeout(pushT);pushT=setTimeout(async()=>{if(writing){again=true;return}writing=true;try{await FB.FS.setDoc(FB.ref,{state:JSON.parse(JSON.stringify(S)),by:FB.user.email||'',at:Date.now()})}catch(e){}writing=false;if(again){again=false;pushFB()}},800)}
const kday=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
function autoDone(key){try{if(!FB||!FB.user)return;const em=(FB.user.email||'').toLowerCase(),t=kday();FB.FS.setDoc(FB.FS.doc(FB.db,'done',em,'days',t),{auto:{[key]:Date.now()},date:t,who:em},{merge:true}).catch(()=>{})}catch(e){}}
const gateEl=document.createElement('div');document.body.appendChild(gateEl);
function gate(msg,loading){gateEl.innerHTML=`<div style="position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:20px"><div class="card" style="max-width:420px;width:100%;text-align:center"><h1 style="margin-bottom:8px">영어교실</h1>${loading?'<p class="sub">로그인 확인 중…</p>':`<p class="sub">기록을 저장하려면 구글 계정으로 로그인해요.</p>${msg?`<p class="msg oops">${msg}</p>`:''}<button class="big" id="gLogin">Google로 로그인</button>`}</div></div>`;const b=document.getElementById('gLogin');if(b)b.onclick=login}
async function login(){try{await FB.AU.signInWithPopup(FB.auth,new FB.AU.GoogleAuthProvider())}catch(e){gate(e&&e.code==='auth/popup-blocked'?'로그인 창이 막혔어요. 한 번 더 눌러 주세요.':e&&e.code==='auth/popup-closed-by-user'?'':'로그인이 안 됐어요 ('+((e&&e.code)||'')+')')}}
(async()=>{const cfg=window.firebaseConfig;if(!cfg||!cfg.apiKey)return;gate('',true);
  try{const V='https://www.gstatic.com/firebasejs/10.12.2/';const A=await import(V+'firebase-app.js'),AU=await import(V+'firebase-auth.js'),FS=await import(V+'firebase-firestore.js');
    const fa=A.initializeApp(cfg),auth=AU.getAuth(fa),db=FS.getFirestore(fa);FB={AU,FS,auth,db,user:null,ref:null};let unsub=null;
    AU.onAuthStateChanged(auth,async u=>{FB.user=u;if(unsub){unsub();unsub=null}if(!u){ACC=null;gate('');return}gateEl.innerHTML='';
      const em=u.email.toLowerCase();ACC=em;ACCNAME=(u.displayName||'').split(' ')[0]||'';try{const m=await FS.getDoc(FS.doc(db,'members',em));if(m.exists()&&m.data().name)ACCNAME=m.data().name}catch(e){}
      loadS();home();FB.ref=FS.doc(db,'progress','eng_'+em);let first=true;
      unsub=FS.onSnapshot(FB.ref,snap=>{const d=snap.exists()?snap.data():null;
        if(d&&d.state&&(d.state.updated||0)>(S.updated||0)){S=JSON.parse(JSON.stringify(d.state));try{localStorage.setItem(KEY(),JSON.stringify(S))}catch(e){}loadFix();if(!L&&!R&&!C&&!G&&!SP)home()}
        else if(first&&S.updated&&(!d||!d.state||(d.state.updated||0)<S.updated))pushFB();first=false},
        e=>{if(e&&e.code==='permission-denied')gate(u.email+' 계정은 가족 목록에 없어요.')})})
  }catch(e){gateEl.innerHTML=''}})();
function loadFix(){S.w=S.w||{};S.g=S.g||{};S.c=S.c||{day:1,last:null,streak:0};S.gs=S.gs||{};S.h=S.h||[];S.t=S.t||{L:[0,0],M:[0,0],S:[0,0],F:[0,0],O:[0,0]};S.t.P=S.t.P||[0,0];S.t.V=S.t.V||[0,0];if(!['c','w','g'].includes(S.tab))S.tab='c'}
home();
}
