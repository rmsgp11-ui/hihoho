<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도형교실</title>
<meta name="theme-color" content="#2f5bea">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE: 다정한 1:1 과외 선생님 공책. 짧은 문장, 구체적인 칭찬, 틀려도 혼내지 않음
   IDEA: 모눈 공책 위에 투명 필름을 올려 놓고 도형을 직접 움직이는 책상
   PICTURE: 문제마다 크게 그린 도형과 각도기, 실험실에서 실제로 돌아가는 도형
   COLOUR and TYPE: 공책 흰색 + 모눈 파랑, 코발트 주색, 노랑 별, 코랄 포인트 / Jua + Gowun Dodum
   LAYOUT: 위쪽 탭, 한 화면에 한 문제, 손가락으로 누르기 쉬운 큰 버튼 */
:root{color-scheme:light dark;
--bg:light-dark(#fffdf6,#10172e);--grid:light-dark(#e6edff,#18223f);
--card:light-dark(#ffffff,#18213f);--ink:light-dark(#1a2240,#eef2ff);--mute:light-dark(#566083,#a9b3d6);
--p:light-dark(#2f5bea,#7d9bff);--p2:light-dark(#e9efff,#24315f);--pink:light-dark(#2448c4,#a9bcff);
--y:#ffcc33;--c:light-dark(#e2452f,#ff7f6b);--ok:light-dark(#0f8a5f,#45d19f);
--okbg:light-dark(#e2f6ee,#12392d);--nobg:light-dark(#ffece9,#3d1d24);
--line:light-dark(#d3dbf1,#2c3966);--sh:light-dark(rgba(30,50,120,.10),rgba(0,0,0,.4))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;color:var(--ink);font:17px/1.6 'Gowun Dodum',system-ui,sans-serif;overflow-x:clip;
background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px;background-blend-mode:normal;min-height:100vh}
h1,h2,h3,.jua{font-family:'Jua',system-ui,sans-serif;font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,44px)}h2{font-size:clamp(24px,3.6vw,32px)}h3{font-size:21px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--line);padding:10px max(4vw,14px) 0}
.tb{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:'Jua';font-size:24px}
.brand svg{width:34px;height:34px}
.pill{display:flex;align-items:center;gap:6px;background:var(--p2);border-radius:99px;padding:6px 14px;font-family:'Jua';font-size:20px;white-space:nowrap}
.pill svg{width:22px;height:22px}
.tabs{display:flex;gap:4px;max-width:980px;margin:8px auto 0;overflow-x:auto}
.tabs button{flex:none;border:0;background:none;padding:10px 16px 12px;font-family:'Jua';font-size:18px;color:var(--mute);border-bottom:4px solid transparent;min-height:48px}
.tabs button.on{color:var(--p);border-color:var(--p)}
main{max-width:980px;margin:0 auto;padding:22px max(4vw,14px) 60px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:clamp(16px,3vw,28px);box-shadow:0 6px 0 var(--sh)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 26px;border-radius:18px;border:0;background:var(--p);color:#fff;font-family:'Jua';font-size:22px;box-shadow:0 5px 0 var(--pink);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink)}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.btn.ghost{background:var(--card);color:var(--p);border:2px solid var(--p);box-shadow:0 4px 0 var(--line)}
.btn.y{background:var(--y);color:#2a2100;box-shadow:0 5px 0 #c99a00}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.mute{color:var(--mute)}.small{font-size:14px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:stretch}
.hero .card{display:flex;flex-direction:column;gap:14px}
.wk{font-family:'Jua';font-size:19px;color:var(--c)}
.bigfig{background:var(--bg);border-radius:18px;padding:10px;display:flex;justify-content:center;align-items:center;min-height:200px}
.bigfig svg{width:100%;max-width:420px;height:auto;max-height:260px}
.stamps{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:'Jua';font-size:13px;color:var(--mute)}
.stamp.s1{background:var(--p2);border:2px solid var(--p);color:var(--p)}
.stamp.s3{background:var(--y);border:2px solid #d9a400;color:#3a2c00}
.daily{display:grid;gap:10px}
.chk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 14px;min-height:56px}
.chk .bx{flex:none;width:28px;height:28px;border-radius:8px;border:3px solid var(--p);display:grid;place-items:center}
.chk.on .bx{background:var(--p)}.chk.on .bx::after{content:'';width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.chk.on span{text-decoration:line-through;color:var(--mute)}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.week{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px}
.week.now{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.week h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.week h3 small{font-family:'Gowun Dodum';font-size:14px;color:var(--mute);white-space:nowrap}
.les{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:10px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);text-align:left;min-height:60px}
.les.rec{border-color:var(--p);background:var(--p2)}
.les[disabled]{opacity:.45;cursor:default}
.les b{font-family:'Jua';font-weight:400;font-size:18px;display:block}
.stars{display:flex;gap:2px;flex:none}.st{width:22px;height:22px;fill:none;stroke:var(--line);stroke-width:2}.st.on{fill:var(--y);stroke:#d9a400}
.big .st{width:54px;height:54px}
.prog{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.prog i{width:34px;height:10px;border-radius:9px;background:var(--line)}
.prog i.d{background:var(--p)}.prog i.x{background:var(--c)}.prog i.c{background:var(--y)}
.q{display:grid;gap:16px}
.qt{font-size:21px;line-height:1.45}
.qt b{color:var(--p)}
.figbox{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}
.figbox svg.fs{width:100%;max-width:440px;height:auto}
.src svg{width:150px;height:auto}
.arrowtxt{font-family:'Jua';font-size:26px;color:var(--c)}
.chs{display:grid;gap:10px}
.chs.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ch{position:relative;border:3px solid var(--line);background:var(--card);border-radius:18px;padding:12px 16px;min-height:60px;font-size:19px;text-align:left;display:flex;align-items:center;gap:12px}
.chs.g2 .ch{justify-content:center;flex-direction:column;text-align:center;padding:10px}
.ch .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--p2);color:var(--p);display:grid;place-items:center;font-family:'Jua';font-size:17px}
.chs.g2 .ch .n{position:absolute;top:8px;left:8px}
.ch svg{width:100%;max-width:150px;height:auto;max-height:140px}
.ch.sel{border-color:var(--p);background:var(--p2)}
.ch.good{border-color:var(--ok);background:var(--okbg)}
.ch.bad{border-color:var(--c);background:var(--nobg);opacity:.6}
.ch[disabled]{cursor:default}
.fb{border-radius:18px;padding:14px 16px;font-size:18px}
.fb.good{background:var(--okbg);border:2px solid var(--ok)}
.fb.bad{background:var(--nobg);border:2px solid var(--c)}
.fb .jua{font-size:22px;display:block;margin-bottom:4px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.concept ul{margin:0;padding-left:1.2em;display:grid;gap:8px;font-size:19px}
.tag{display:inline-block;font-size:14px;background:var(--p2);color:var(--p);border-radius:99px;padding:3px 12px;margin-bottom:8px}
.hands{border:3px dashed var(--c);border-radius:20px;padding:18px;background:var(--bg);font-size:19px}
.twofig{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.twofig figure{margin:0;text-align:center;font-size:15px;color:var(--mute)}
.twofig svg{width:140px;height:auto}
.statg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
.stat .v{font-family:'Jua';font-size:clamp(26px,4vw,36px);line-height:1.1}
.stat .l{font-size:14px;color:var(--mute)}
.bar{display:grid;grid-template-columns:10em minmax(0,1fr) 3.6em;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.bar .t{height:14px;border-radius:9px;background:var(--line);overflow:hidden}.bar .t i{display:block;height:100%;border-radius:9px}
.bar .p{text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:400;font-size:13px}
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.lb svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.ctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.ctl button{min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-size:15px;line-height:1.25;padding:6px}
.ctl button.k{font-family:'Jua';font-size:20px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;min-width:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-family:'Jua';font-size:18px}
.seg button.on{border-color:var(--p);background:var(--p2);color:var(--p)}
input[type=range]{width:100%;height:44px;accent-color:var(--p)}
.readout{font-family:'Jua';font-size:clamp(40px,7vw,60px);line-height:1;color:var(--p)}
svg text{font-family:'Gowun Dodum',system-ui,sans-serif}
.gl line{stroke:var(--line);stroke-width:1}
.cells rect{fill:var(--p);stroke:var(--card);stroke-width:1.5}
.ghost rect{fill:none;stroke:var(--mute);stroke-width:2;stroke-dasharray:4 3}
.dot{fill:var(--y);stroke:#3a2c00;stroke-width:1.2}
.prot{fill:color-mix(in srgb,var(--p) 9%,transparent);stroke:var(--mute);stroke-width:1.2}
.tk{stroke:var(--mute);stroke-width:1}
.to,.ti,.al,.sl,.pl{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:middle}
.to{fill:var(--p);font-size:12.5px;letter-spacing:-.4px;stroke-width:3px}.ti{fill:var(--c);font-size:10.5px;letter-spacing:-.5px;stroke-width:3px}
.ray{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.arc{fill:none;stroke:var(--c);stroke-width:2.5}.arc2{fill:none;stroke:var(--p);stroke-width:2.5}
.poly{fill:color-mix(in srgb,var(--p) 14%,transparent);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.diag{stroke:var(--c);stroke-width:1.6;stroke-dasharray:5 4}
.al{fill:var(--ink);font-size:16px}.al.qm{fill:var(--c);font-size:20px;font-family:'Jua'}
.sl{fill:var(--ink);font-size:15px}.pl{fill:var(--ink);font-size:16px}
.mk{fill:none;stroke:var(--ink);stroke-width:1.8}
.pt{fill:var(--ink)}
.tree rect{fill:var(--card);stroke:var(--p);stroke-width:2}.tree text{fill:var(--ink);font-size:14px;text-anchor:middle;dominant-baseline:middle}.tree path{stroke:var(--mute);stroke-width:2;fill:none}
#lg{transform-box:fill-box;transform-origin:center;transition:transform .45s ease}
.toast{min-height:26px;color:var(--c);font-size:15px;text-align:center}
.sync{font-size:13px;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:20px}
.modal .card{max-width:420px}
select{font:inherit;font-size:17px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;width:100%}
.seg button{padding:0 14px}
.toolbar{margin:0 0 14px}
.dg{width:100%;max-width:360px;height:auto;display:block;margin:0 auto;touch-action:manipulation}
.dg rect.c{fill:var(--card);stroke:var(--line);stroke-width:1.5;cursor:pointer}
.dg rect.on{fill:var(--p)}.dg rect.gv{fill:var(--ink);opacity:.82;cursor:default}.dg rect.lk{fill:var(--bg);cursor:default}
.dg rect.okc{fill:var(--ok)}.dg rect.bad{fill:var(--c)}.dg rect.miss{fill:none;stroke:var(--ok);stroke-width:3.5;stroke-dasharray:6 4}
.mir{stroke:var(--c);stroke-width:4;stroke-dasharray:8 5}
.mirrow{display:flex;align-items:center;justify-content:center;gap:12px}.mircol{display:flex;flex-direction:column;align-items:center;gap:8px}
.mi{width:120px;display:grid;place-items:center}.mi svg{width:110px;height:auto}.mi.q{font-family:'Jua';font-size:56px;color:var(--c);height:100px}
.mglass{border:2px solid #7fb3dd;border-radius:8px}.mglass.v{width:16px;height:130px;background:linear-gradient(90deg,#a9d6f7,#eef8ff,#a9d6f7)}.mglass.h{height:16px;width:160px;background:linear-gradient(#7fc1ee,#d7efff,#7fc1ee)}
.gly text{font-family:'Jua',system-ui,sans-serif;font-size:62px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.geo{width:100%;max-width:380px;height:auto;display:block;margin:0 auto;touch-action:manipulation}
.gd{fill:var(--mute)}.gv{fill:var(--p)}.gv0{fill:var(--y);stroke:var(--ink);stroke-width:2}
.gline{fill:none;stroke:var(--p);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}.hit{fill:transparent;cursor:pointer}
.tg{width:100%;max-width:440px;height:auto;display:block;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.tgt{opacity:.8}.tgt polygon{fill:var(--ink);stroke:var(--ink);stroke-width:1}
.tgt polygon.tl{stroke:var(--bg);stroke-width:2.5}
.tgt polygon.th{fill:var(--y);stroke:#b98a00;stroke-width:2.5}
.tray{fill:var(--bg);stroke:var(--line);stroke-width:2;stroke-dasharray:6 5}
.pc{stroke:#fff;stroke-width:1.5;stroke-linejoin:round;cursor:grab;opacity:.96}
.pc.sel{stroke:var(--ink);stroke-width:3}
.tgok .pc{stroke:#fff;opacity:1}
.pinbox{max-width:360px;margin:0 auto;text-align:center;display:grid;gap:16px;justify-items:center}
.pdots{display:flex;gap:14px}.pdots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--p)}.pdots i.f{background:var(--p)}
.pkeys{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pkeys button{height:64px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-family:'Jua';font-size:28px;box-shadow:0 4px 0 var(--sh)}
.pkeys button:active{transform:translateY(2px)}
@media(max-width:760px){.hero,.lab{grid-template-columns:minmax(0,1fr)}.statg{grid-template-columns:repeat(2,minmax(0,1fr))}.stamps{grid-template-columns:repeat(8,minmax(0,1fr))}}
@media(max-width:600px){.brand{font-size:20px}.qt{font-size:19px}.ch{font-size:17px}.bar{grid-template-columns:7.5em minmax(0,1fr) 3.2em}.btn{font-size:20px;padding:0 18px}}
@media(prefers-reduced-motion:reduce){#lg{transition:none}.shake{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="tb">
    <div class="brand"><svg viewBox="0 0 34 34"><rect x="2" y="2" width="30" height="30" rx="8" fill="var(--p)"/><path d="M9 25 L17 9 L25 25 Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><circle cx="17" cy="20" r="2.6" fill="var(--y)"/></svg>도형교실</div>
    <div class="pill" id="pill"></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-a="go" data-v="today">오늘</button>
    <button data-a="go" data-v="map">12주 지도</button>
    <button data-a="go" data-v="lab">실험실</button>
    <button data-a="go" data-v="parent">보호자</button>
  </nav>
</header>
<main id="app"><p>불러오는 중…</p></main>
<div id="modal"></div>
<script>
{
/* ---------- 기본 도구 ---------- */
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rad=d=>d*Math.PI/180;
const f1=n=>Math.round(n*10)/10;
const strip=h=>String(h).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
const STAR='M12 2l2.9 6.5 7.1.7-5.3 4.8 1.5 7-6.2-3.6-6.2 3.6 1.5-7L2 9.2l7.1-.7z';
const star=on=>`<svg class="st ${on?'on':''}" viewBox="0 0 24 24"><path d="${STAR}"/></svg>`;
const stars=n=>`<span class="stars">${[0,1,2].map(i=>star(i<n)).join('')}</span>`;

function numCh(ans,cands,unit,steps){
  const seen=new Set([ans]);const out=[];
  for(const c of shuf(cands)){if(c>0&&!seen.has(c)&&out.length<3){seen.add(c);out.push(c)}}
  for(const d of (steps||[10,20,5,30,15])){for(const c of [ans+d,ans-d]){if(out.length<3&&c>0&&!seen.has(c)){seen.add(c);out.push(c)}}}
  return shuf([ans,...out]).map(v=>({h:v+unit,ok:v===ans}));
}
const txtCh=(ans,others)=>shuf([ans,...others]).map(t=>({h:t,ok:t===ans}));

/* ---------- 모눈 도형 ---------- */
const SH={
  L:{c:[[0,0],[0,1],[0,2],[1,2]],m:0},
  F:{c:[[1,0],[2,0],[0,1],[1,1],[1,2]],m:1},
  P:{c:[[0,0],[1,0],[0,1],[1,1],[0,2]],m:4},
  N:{c:[[1,0],[1,1],[0,2],[1,2],[0,3]],m:0},
  Y:{c:[[1,0],[0,1],[1,1],[1,2],[1,3]],m:1}};
const TF={id:p=>p,fh:([x,y])=>[-x,y],fv:([x,y])=>[x,-y],r90:([x,y])=>[-y,x],r180:([x,y])=>[-x,-y],r270:([x,y])=>[y,-x],d1:([x,y])=>[y,x],d2:([x,y])=>[-y,-x]};
const D4=Object.keys(TF);
function norm(c){const mx=Math.min(...c.map(p=>p[0])),my=Math.min(...c.map(p=>p[1]));return c.map(([x,y])=>[x-mx,y-my])}
function tf(sh,...fs){let c=sh.c;for(const f of fs)c=c.map(TF[f]);return{c:norm(c),m:sh.m}}
const skey=sh=>sh.c.map(p=>p.join(',')).sort().join(';')+'|'+sh.c[sh.m].join(',');
const dims=sh=>[Math.max(...sh.c.map(p=>p[0]))+1,Math.max(...sh.c.map(p=>p[1]))+1];

quad4th(){let al;do{al=[R(13,25)*5,R(13,25)*5,R(13,25)*5];al.push(360-al[0]-al[1]-al[2])}while(al[3]<65||al[3]>125);const qi=R(0,3);const s=al.reduce((x,y)=>x+y,0)-al[qi];

rotFact(){const B=[
  ['시계 방향으로 90°만큼 돌린 것과 결과가 같은 것은?','시계 반대 방향으로 270°',['시계 반대 방향으로 90°','시계 방향으로 180°','위쪽으로 뒤집기']],

  const b=pick(B);return{p:b[0],ch:txtCh(b[1],b[2]),hint:'실험실에서 직접 돌려 보면 바로 알 수 있어!',ex:`정답은 <b>${b[1]}</b>. 한 바퀴는 360°, 시계 방향 90° = 시계 반대 방향 270°예요.`}},
whichOp(){const sh=SH[pick(Object.keys(SH))];const set=[['fr','fh'],['fu','fv'],['c90','r90'],['c180','r180'],['a90','r270']];const ans=pick(set);const others=shuf(set.filter(s=>s!==ans)).slice(0,3);

combo(){const sh=SH[pick(Object.keys(SH))];const A=pick(['fr','fu']),B=pick(['c90','c180','a90']);const seq=Math.random()<.5?[A,B]:[B,A];const fs=seq.map(k=>OPN[k][1]);

triSide(){const t=pick(['eq','iso','iso','sca']);let a,b,c;
  if(t==='eq'){a=b=c=R(4,9)}else if(t==='iso'){const s=R(5,9);let u;do{u=R(3,12)}while(u===s||u>=2*s);[a,b,c]=shuf([s,s,u])}else{do{[a,b,c]=[R(4,10),R(4,10),R(4,10)]}while(a===b||b===c||a===c||a+b<=c+1||a+c<=b+1||b+c<=a+1)}
  const pts=triBySides(a,b,c);const ans=t==='eq'?'정삼각형':t==='iso'?'이등변삼각형':'세 변의 길이가 모두 달라요';

isoAngle(){const v=Math.random();

perpPar(){const t=pick(['p','l','n']);const th=pick([0,15,30,-20,40]);const cx=150,cy=90;

quadName(o){const ty=pick(o&&o.only||['trap','para','rhom','rect','sq']);const N={trap:'사다리꼴',para:'평행사변형',rhom:'마름모',rect:'직사각형',sq:'정사각형'};

rhombus(){const v=pick(['rh','re','pa']);

polyName(){const n=R(5,10);const NM=['','','','삼각형','사각형','오각형','육각형','칠각형','팔각형','구각형','십각형'];const others=shuf([n-1,n+1,n+2>10?n-2:n+2]).map(k=>NM[k]);

  const tpx=sol.map(x=>x.p.map(q=>[ox+q[0]*k,oy+q[1]*k]));const trayY=18+bh*k+34;
  const pieces=shuf(sol.map((x,i)=>({t:x.t,rot:R(0,7),f:false,x:0,y:0,c:TCOL[i%7]})));
  let x=16,y=trayY,rh=0;for(const pc of pieces){const bb=bbx(ptsOf(pc,k)),w=bb.x1-bb.x0,h=bb.y1-bb.y0;if(x+w>W-16){x=16;y+=rh+14;rh=0}pc.x=x-bb.x0;pc.y=y-bb.y0;x+=w+16;rh=Math.max(rh,h)}
  return{pz,sol,tpx,verts:tpx.flat(),k,W,H:y+rh+18,trayY,pieces,sel:null,lines:false,hints:new Set(),solved:false}}
function tgSVG(T){const order=T.pieces.map((_,i)=>i).filter(i=>i!==T.sel);if(T.sel!=null)order.push(T.sel);
  return`<svg id="tgsvg" class="tg ${T.solved?'tgok':''}" viewBox="0 0 ${T.W} ${T.H}" role="img" aria-label="칠교판"><g class="tgt">${T.tpx.map((p,i)=>`<polygon points="${PS(p)}" class="${T.hints.has(i)?'th':T.lines||T.solved?'tl':''}"/>`).join('')}</g>
  <rect class="tray" x="6" y="${T.trayY-14}" width="${T.W-12}" height="${T.H-T.trayY+8}" rx="16"/>${order.map(i=>{const pc=T.pieces[i];return`<polygon class="pc ${T.sel===i?'sel':''}" data-tp="${i}" points="${PS(ptsOf(pc,T.k))}" style="fill:${pc.c}"/>`}).join('')}</svg>`}
function tgSnap(T,i){const pc=T.pieces[i],P=ptsOf(pc,T.k);let best=null;for(const a of P)for(const v of T.verts){const d=Math.hypot(v[0]-a[0],v[1]-a[1]);if(!best||d<best.d)best={d,dx:v[0]-a[0],dy:v[1]-a[1]}}
  if(best&&best.d<T.k*0.45){pc.x+=best.dx;pc.y+=best.dy}}
function tgCheck(T){const b=bbx(T.tpx.flat()),st=T.k*0.1,pp=T.pieces.map(pc=>ptsOf(pc,T.k));let tin=0,cov=0,over=0,out=0;
  for(let x=b.x0-st*2.5;x<b.x1+st*3;x+=st)for(let y=b.y0-st*2.5;y<b.y1+st*3;y+=st){const it=T.tpx.some(p=>pin(x,y,p));let n=0;for(const p of pp)if(pin(x,y,p))n++;if(it){tin++;if(n)cov++;if(n>1)over++}else if(n)out++}
  return cov/tin>0.97&&over/tin<0.03&&out/tin<0.03}
let TG=null,W_=null,drag=null;
function tgPanel(T,extra){TG=T;return`<div class="card q"><p class="qt" style="margin:0">「<b>${T.pz.n}</b>」 모양을 칠교 조각으로 채워 봐요.</p><p class="small mute" style="margin:0">조각을 끌어서 옮겨요. 고른 조각을 <b>한 번 더 누르면 45° 돌아가요</b>. 가까이 가면 딱 붙어요.</p>
  <div id="tgbox">${tgSVG(T)}</div>${T.solved?`<div class="fb good"><span class="jua">완성! ${pick(PRAISE)}</span>조각 ${T.pieces.length}개로 「${T.pz.n}」을 만들었어!${T.hints.size?` (힌트 ${T.hints.size}번)`:''}</div>`:`<div class="toast" id="tgmsg" style="min-height:0"></div>`}
  ${T.solved?'':`<div class="ctl"><button data-a="tgrot">돌리기<br>45° ↻</button><button data-a="tgflip">뒤집기<br>(평행사변형)</button><button data-a="tghint">힌트<br>조각 하나</button><button data-a="tglines">${T.lines?'선 숨기기':'선 보기'}</button><button data-a="tgreset">처음부터</button></div>`}${extra||''}</div>`}
function warmSet(){const n=S.tgc||0;const lv=n<6?[0,0,1]:n<15?[0,1,2]:[1,2,2];const used=new Set();return lv.map(l=>{const c=TGP.filter(p=>p.lv===l&&!used.has(p.n));const p=pick(c.length?c:TGP.filter(p=>p.lv===l));used.add(p.n);return p})}
function vWarm(){const w=W_;if(w.done)return`<div class="card q" style="text-align:center;justify-items:center"><h2>워밍업 끝!</h2><div class="big">${stars(Math.min(3,w.solved))}</div><p style="margin:0;font-size:19px">오늘 칠교 <b>${w.solved}개</b> 완성${w.hints?` · 힌트 ${w.hints}번`:''}</p><p class="mute" style="margin:0">머리가 말랑말랑해졌어. 이제 오늘의 수업으로 가 볼까?</p><div class="row" style="justify-content:center"><button class="btn" data-a="start" data-id="${recLesson().id}">오늘의 수업 하기</button><button class="btn ghost" data-a="wquit">처음 화면</button></div></div>`;
  const left=Math.max(0,300-Math.floor((Date.now()-w.t0)/1000)),T=w.tg;const last=w.i>=w.list.length-1||w.timeUp;
  return`<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>칠교 워밍업 ${w.i+1} / ${w.list.length}</h2><span class="pill" id="wtime">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</span></div>
  ${w.timeUp&&!T.solved?'<div class="fb bad" style="margin-bottom:12px"><span class="jua">5분이 다 됐어요!</span>이 문제까지만 하고 끝내자. 힘들면 힌트를 써도 돼.</div>':''}
  ${tgPanel(T,`<div class="row">${T.solved?`<button class="btn" data-a="wnext">${last?'워밍업 끝내기':'다음 칠교'}</button>`:`<button class="btn ghost" data-a="wskip">${last?'끝내기':'건너뛰기'}</button>`}</div>`)}`}
function pTan(){if(!lab.tg)lab.tg=tgSetup(pick(TGP.filter(p=>p.lv===(lab.tgLv||0))));
  return`<div class="seg" style="margin-bottom:12px">${LVN.map((n,i)=>`<button class="${(lab.tgLv||0)===i?'on':''}" data-a="tglv" data-k="${i}">${n}</button>`).join('')}<button data-a="tgnew">다른 모양</button></div>`+tgPanel(lab.tg)}
function tgDone(T){if(T.solved||!tgCheck(T))return;T.solved=true;T.sel=null;if(W_&&W_.tg===T){W_.solved++;W_.hints+=T.hints.size}}

function irr(n){let p;for(let t=0;t<20;t++){p=regPts(n,22);const d=p.map((v,i)=>Math.hypot(v[0]-p[(i+1)%n][0],v[1]-p[(i+1)%n][1]));if(Math.max(...d)/Math.min(...d)>1.25)return p}return p}
function moveQ(keys){const sh=SH[pick(Object.keys(SH))];const k=pick(keys);const[label,f]=OPN[k];
  return{p:`이 도형을 <b>${label}</b> 했어요. 어떤 모양이 될까요?`,fig:`<div class="src">${gsvg(sh,{px:30,mark:MARK})}</div>`,ch:shapeOpts(tf(sh,f),CONF[f].map(g=>tf(sh,g)),sh,MARK),g2:1,hint:HDOT,ex:EXF[f]}}
function quadFig(ty,W,H){const o={W:W||300,H:H||190};
  if(ty==='trap'){const a=R(11,14)*5,b=R(12,15)*5;return polyFig(polyAngles([a,b,180-b,180-a],[1.9,0.95]),o)}
  if(ty==='para'){const a=R(11,14)*5;return polyFig(polyAngles([a,180-a,a,180-a],[1.7,1]),{...o,ticks:[1,2,1,2]})}
  if(ty==='rhom'){const a=R(11,14)*5;return polyFig(polyAngles([a,180-a,a,180-a],[1.2,1.2]),{...o,ticks:[1,1,1,1]})}
  if(ty==='rect')return polyFig(polyAngles([90,90,90,90],[1.8,1]),{...o,ticks:[1,2,1,2],right:[1,1,1,1]});
  return polyFig(polyAngles([90,90,90,90],[1.2,1.2]),{...o,ticks:[1,1,1,1],right:[1,1,1,1]});
}

async function push(){if(!FB||!FB.user)return;if(writing){again=true;return}writing=true;
  try{await FB.FS.setDoc(FB.ref,{state:JSON.parse(JSON.stringify(S)),by:FB.user.email||'',at:FB.FS.serverTimestamp()});sync='cloud'}catch(e){sync='local'}
  writing=false;if(again){again=false;push()}paintSync()}
function adopt(d){if(d&&d.state&&(d.state.updated||0)>(S.updated||0)){S=Object.assign(blank(),JSON.parse(JSON.stringify(d.state)));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(!cur&&!W_&&!drag)render();return true}return false}
function gate(msg){$('#modal').innerHTML=`<div class="modal" style="background:var(--bg)"><div class="card q" style="text-align:center;justify-items:center"><h2>도형교실</h2><p style="margin:0">진도를 저장하려면 구글 계정으로 로그인해요.</p>${msg?`<div class="fb bad" style="text-align:left">${msg}</div>`:''}<button class="btn" data-a="login">Google로 로그인</button><p class="small mute" style="margin:0">카카오톡 안 브라우저에서는 로그인이 안 돼요. <b>Chrome</b>으로 열어 주세요.</p></div></div>`}
async function initDB(){
  const cfg=window.firebaseConfig;if(!cfg||!cfg.apiKey){sync='local';paintSync();return}
  try{const A=await import(FV+'firebase-app.js'),AU=await import(FV+'firebase-auth.js'),FS=await import(FV+'firebase-firestore.js');
    const app=A.initializeApp(cfg),auth=AU.getAuth(app);FB={AU,FS,auth,ref:FS.doc(FS.getFirestore(app),'progress','jiho'),user:null};
    $('#modal').innerHTML='<div class="modal" style="background:var(--bg)"><div class="card q" style="text-align:center"><h2>도형교실</h2><p class="mute" style="margin:0">로그인 확인 중…</p></div></div>';
    AU.onAuthStateChanged(auth,u=>{FB.user=u;if(unsub){unsub();unsub=null}
      if(!u){sync='local';gate('');paintSync();return}
      $('#modal').innerHTML='';let first=true;
      unsub=FS.onSnapshot(FB.ref,snap=>{const d=snap.exists()?snap.data():null;const took=adopt(d);if(first){first=false;if(!took&&S.updated&&(!d||!d.state||(d.state.updated||0)<S.updated))push()}sync='cloud';paintSync()},
        e=>{sync='local';paintSync();if(e&&e.code==='permission-denied')gate(`<b>${u.email}</b> 계정은 허용 목록에 없어요. Firestore 규칙에 이 메일을 넣었는지 확인해 주세요.`)});
    });
  }catch(e){sync='local';paintSync()}
}
async function login(){if(!FB)return;const p=new FB.AU.GoogleAuthProvider();
  try{await FB.AU.signInWithPopup(FB.auth,p)}catch(e){if(e&&e.code==='auth/popup-blocked')return gate('로그인 창이 막혔어요. 버튼을 한 번 더 눌러 주세요.');
    gate(e&&e.code==='auth/unauthorized-domain'?'이 주소가 Firebase 승인된 도메인에 없어요 (7번 단계 확인).':e&&e.code==='auth/popup-closed-by-user'?'':'로그인이 안 됐어요: '+((e&&e.code)||'알 수 없는 오류'))}}
function paintSync(){const el=$('#sync');if(el)el.innerHTML=(sync==='cloud'?'진도가 클라우드에 저장돼요 (다른 기기에서도 이어서 할 수 있어요)':'지금은 이 기기에만 저장돼요')+(FB&&FB.user?` · ${FB.user.email} <button class="btn ghost" style="min-height:40px;font-size:15px;padding:0 12px" data-a="logout">로그아웃</button>`:'')}

  if(c.step==='done'){const fo=c.res.filter(r=>r.ok).length,st=fo>=5?3:fo>=4?2:fo>=3?1:0;const nx=LESSONS[L.id];
    return`<div class="card q" style="text-align:center;justify-items:center"><h2>${st===3?'완벽해!':st>0?'잘했어!':'좋은 연습이었어!'}</h2><div class="big">${stars(st)}</div>

  const q=c.qs[c.i];const done=c.state==='right'||c.state==='shown';

  const chs=q.draw?'':q.ch.map((o,i)=>{let cl='ch';if(c.out[i]==='bad')cl+=' bad';if(done&&o.ok)cl+=' good';else if(c.sel===i&&!c.out[i])cl+=' sel';const dis=done||c.out[i]?'disabled':'';return`<button class="${cl}" data-a="pick" data-i="${i}" ${dis}><span class="n">${i+1}</span>${o.h}</button>`}).join('');
  let fb='';
  if(c.state==='retry')fb=`<div class="fb bad ${c.shake?'shake':''}"><span class="jua">${c.quick?'앗, 너무 빨리 골랐어!':pick(AGAIN)}</span>${c.quick?'손가락으로 하나씩 짚어 보면서 다시 골라 보자. ':''}${q.hint}</div>`;
  if(c.state==='right')fb=`<div class="fb good"><span class="jua">${c.tries===0?pick(PRAISE):'두 번째에 해냈어!'}</span>${q.ex}</div>`;

  const empty=q.draw?!c.cells.size:c.sel==null;

  let body;if(q.draw){const d=q.draw;body=`<div class="figbox" style="flex-direction:column">${dgrid(d.W,d.H,{given:d.given,cells:c.cells,mirror:d.mirror,lock:d.lock,act:done?null:'dcell',res:done&&d.want?d.want:null})}${done?'':'<button class="btn ghost" data-a="dclear" style="min-height:44px;font-size:17px">다 지우기</button>'}</div>`}
  else body=`<div class="chs ${q.g2?'g2':''}">${chs}</div>`;
  return`${prog}<div class="card q"><div class="qt">${q.p}</div>${q.fig?`<div class="figbox">${q.fig}</div>`:''}${body}${fb}<div class="row">${btn}<button class="btn ghost" data-a="exit">그만하기</button></div></div>`;
}

function labBoard(){const N=7,px=34;let g='';for(let i=0;i<=N;i++)g+=`<line x1="${i*px}" y1="0" x2="${i*px}" y2="${N*px}"/><line x1="0" y1="${i*px}" x2="${N*px}" y2="${i*px}"/>`;

function labOp(o){if(lab.busy)return;const N=7,px=34;const[w,h]=dims(lab.sh);const g=$('#lg');lab.msg='';
  if(o==='reset'){lab.sh=tf(SH[lab.k],'id');const[w2,h2]=dims(lab.sh);lab.ox=Math.floor((N-w2)/2);lab.oy=Math.floor((N-h2)/2);return render()}
  const mv={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[o];let css,apply;
  if(mv){const nx=lab.ox+mv[0],ny=lab.oy+mv[1];if(nx<0||ny<0||nx+w>N||ny+h>N){$('#ltoast').textContent='더 밀면 모눈 밖으로 나가요!';return}
    css=`translate(${mv[0]*px}px,${mv[1]*px}px)`;apply=()=>{lab.ox=nx;lab.oy=ny;lab.msg='밀기: 모양은 그대로!'}}
  else{css={fh:'scaleX(-1)',fv:'scaleY(-1)',r90:'rotate(90deg)',r270:'rotate(-90deg)'}[o];
    apply=()=>{const ns=tf(lab.sh,o);const[nw,nh]=dims(ns);lab.ox=Math.max(0,Math.min(N-nw,Math.round(lab.ox+(w-nw)/2)));lab.oy=Math.max(0,Math.min(N-nh,Math.round(lab.oy+(h-nh)/2)));lab.sh=ns;
      lab.msg={fh:'왼쪽과 오른쪽이 바뀌었어!',fv:'위와 아래가 바뀌었어!',r90:'위쪽이 오른쪽으로 갔어!',r270:'위쪽이 왼쪽으로 갔어!'}[o]}}

let pinOK=false,pinT=0,PIN={mode:'',buf:'',first:'',msg:'',bad:0,until:0};
async function hashPin(x){const t='jiho-geo:'+x;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))|0;return'h'+h}}
function vPin(){const m=PIN.mode||(S.pin?'enter':'create');PIN.mode=m;const wait=PIN.until>Date.now();
  const title=m==='create'?'보호자 비밀번호 만들기':m==='confirm'?'한 번 더 입력해 주세요':'보호자 비밀번호';
  const sub=m==='create'?'숫자 4자리를 정해 주세요. 아이가 모르는 번호로!':m==='confirm'?'같은 번호를 다시 눌러요.':'보호자 화면을 보려면 비밀번호를 눌러요.';
  return`<div class="card"><div class="pinbox"><h2>${title}</h2><p class="mute" style="margin:0">${sub}</p>
  <div class="pdots">${[0,1,2,3].map(i=>`<i class="${i<PIN.buf.length?'f':''}"></i>`).join('')}</div>
  <div class="toast">${wait?'여러 번 틀려서 30초 동안 잠겼어요.':PIN.msg}</div>
  <div class="pkeys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-a="pk" data-k="${n}" ${wait?'disabled':''}>${n}</button>`).join('')}<button data-a="pkx" aria-label="취소" style="font-size:17px">${m==='enter'?'':'취소'}</button><button data-a="pk" data-k="0" ${wait?'disabled':''}>0</button><button data-a="pkdel" aria-label="지우기">⌫</button></div>
  ${m==='enter'?'<button class="btn ghost" data-a="pkforgot" style="min-height:44px;font-size:16px">비밀번호를 잊었어요</button>':''}</div></div>`}
async function pinDigit(k){const m=PIN.mode;if(PIN.buf.length>=4||PIN.until>Date.now())return;PIN.buf+=k;PIN.msg='';render();if(PIN.buf.length<4)return;
  const v=PIN.buf;await new Promise(r=>setTimeout(r,150));PIN.buf='';
  if(m==='create'){PIN.first=v;PIN.mode='confirm'}
  else if(m==='confirm'){if(v===PIN.first){S.pin=await hashPin(v);save();pinOK=true;pinT=Date.now();PIN.mode='';PIN.msg=''}else{PIN.mode='create';PIN.msg='두 번 누른 번호가 달라요. 처음부터 다시!'}}
  else{if(await hashPin(v)===S.pin){pinOK=true;pinT=Date.now();PIN.bad=0;PIN.mode=''}else{PIN.bad++;PIN.msg='번호가 틀렸어요.';if(PIN.bad>=5){PIN.bad=0;PIN.until=Date.now()+30000;setTimeout(render,30100)}}}
  render()}
function vParent(){if(pinOK&&Date.now()-pinT>10*60*1000)pinOK=false;if(!pinOK||PIN.mode==='create'||PIN.mode==='confirm')return vPin();const done=LESSONS.filter(L=>best(L.id)>0).length;let ok=0,tot=0;Object.values(S.keys).forEach(([a,b])=>{ok+=a;tot+=b});

  let sp=[0,0];SPATIAL.forEach(k=>{if(S.keys[k]){sp[0]+=S.keys[k][0];sp[1]+=S.keys[k][1]}});
  const qw=S.qw||[0,0];
  return`<h2 style="margin-bottom:6px">보호자 보기</h2><p class="mute" style="margin-top:0">숫자는 "처음 시도에 바로 맞힌 비율"이에요. 두 번째에 맞힌 건 정답으로 치지 않아요.</p>
  <div class="statg"><div class="stat"><div class="v">${done} / 24</div><div class="l">별 받은 수업</div></div>
   <div class="stat"><div class="v">${tot?Math.round(100*ok/tot)+'%':'–'}</div><div class="l">한 번에 맞힌 비율 (${tot}문제)</div></div>
   <div class="stat"><div class="v">${sp[1]?Math.round(100*sp[0]/sp[1])+'%':'–'}</div><div class="l">공간(이동) 문제 정답률</div></div>
   <div class="stat"><div class="v">${qw[1]?Math.round(100*qw[0]/qw[1])+'%':'–'}</div><div class="l">틀린 문제 중 3초 안에 찍은 비율</div></div></div>
  <div class="card" style="margin-top:16px"><h3>일정</h3><p class="small mute" style="margin:4px 0 0">칠교 워밍업: 지금까지 ${S.tgc||0}개 완성 · 힌트 ${S.tgh||0}번 · 워밍업 한 날 ${Object.values(S.daily).filter(d=>d.warm).length}일</p><p style="margin:6px 0 0">${wk===0?'12월 1일에 1주차가 시작돼요.':behind>0?`지금 ${wk}주차인데 진도는 ${rec.w}주차예요. <b>${behind}주 늦어요.</b> 수업을 건너뛰지 말고 하루 2개로 따라잡으세요.`:`일정대로 가고 있어요. 지금 ${wk}주차, 다음 수업은 「${rec.t}」.`}</p>
   <p class="small mute">「찍은 비율」이 30%를 넘으면 실력보다 충동성이 점수를 깎고 있다는 뜻이에요. 그럴 땐 문제 풀 때 "손가락으로 짚고 소리 내어 말하기"를 규칙으로 정해 주세요.</p></div>
  <div class="card" style="margin-top:16px"><h3>약한 부분 (낮은 순)</h3>${ks.length?ks.slice(0,10).map(x=>`<div class="bar"><span>${KN[x.k]}</span><span class="t"><i style="width:${x.p}%;background:${x.p<60?'var(--c)':x.p<80?'var(--y)':'var(--ok)'}"></i></span><span class="p">${x.p}%</span></div>`).join('')+'<p class="small mute">2문제 이상 푼 영역만 보여요. 60% 아래(빨강)는 실험실이나 필름으로 다시 해 주세요.</p>':'<p class="mute">아직 푼 문제가 없어요.</p>'}</div>
  <div class="card" style="margin-top:16px"><h3>최근에 틀린 문제</h3>${S.log.length?S.log.slice(0,15).map(r=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="small mute">${r.d.slice(5).replace('-','/')} · ${r.l}강 · ${KN[r.k]||r.k}${r.quick?' · <b style="color:var(--c)">3초 안에 찍음</b>':''}</div><div>${r.q}</div></div>`).join(''):'<p class="mute">아직 없어요.</p>'}</div>
  <div class="card" style="margin-top:16px"><h3>설정</h3><div class="row" style="margin-top:10px"><button class="btn ghost" data-a="pinChange">비밀번호 바꾸기</button><button class="btn ghost" data-a="pinLock">잠그기</button><button class="chk ${S.open?'on':''}" style="width:auto" data-a="toggleOpen"><span class="bx"></span><span>모든 수업 열기 (순서 상관없이)</span></button><button class="btn ghost" data-a="askReset">기록 지우기</button></div><p class="sync" id="sync"></p></div>`}

/* ---------- 동작 ---------- */
function startLesson(id){const L=LESSONS[id-1];if(!L||!unlocked(id))return;cur={L,step:'concept',qs:makeQs(L),i:0,sel:null,out:{},cells:new Set(),tries:0,state:'',res:[],t0:0};render();scrollTo(0,0)}
function finish(){const c=cur,L=c.L;const fo=c.res.filter(r=>r.ok).length,st=fo>=5?3:fo>=4?2:fo>=3?1:0;
  const r=S.les[L.id]||{best:0,tries:0};r.tries++;r.best=Math.max(r.best,st);r.last=fo;r.date=today();S.les[L.id]=r;
  c.res.forEach(x=>{const k=S.keys[x.key]||[0,0];k[1]++;if(x.ok)k[0]++;S.keys[x.key]=k;if(!x.ok){S.qw[1]++;if(x.quick)S.qw[0]++;S.log.unshift({d:today(),l:L.id,k:x.key,q:x.txt.slice(0,80),quick:x.quick})}});
  S.log=S.log.slice(0,60);const d=S.daily[today()]||{};d.les=1;S.daily[today()]=d;c.step='done';save();render();scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
  if(a==='go'){cur=null;W_=null;if(b.dataset.v!=='parent'){pinOK=false;PIN.mode='';PIN.buf=''}if(location.hash==='#'+b.dataset.v)render();else location.hash=b.dataset.v;return}
  if(a==='start'){W_=null;return startLesson(+b.dataset.id)}
  if(a==='warmStart'){const list=warmSet();W_={list,i:0,t0:Date.now(),solved:0,hints:0,timeUp:false,done:false,tg:tgSetup(list[0])};render();return scrollTo(0,0)}
  if(a==='wnext'||a==='wskip'){const w=W_;if(w.i>=w.list.length-1||w.timeUp){w.done=true;const d=S.daily[today()]||{};d.warm=1;S.daily[today()]=d;S.tgc=(S.tgc||0)+w.solved;S.tgh=(S.tgh||0)+w.hints;save()}else{w.i++;w.tg=tgSetup(w.list[w.i])}render();return scrollTo(0,0)}
  if(a==='wquit'){W_=null;return render()}
  if(a==='tgrot'||a==='tgflip'){const T=TG;if(!T)return;if(T.sel==null){const m=$('#tgmsg');if(m)m.textContent='먼저 움직일 조각을 눌러요!';return}const pc=T.pieces[T.sel];if(a==='tgrot')pc.rot=(pc.rot+1)%8;else pc.f=!pc.f;tgSnap(T,T.sel);tgDone(T);return render()}
  if(a==='tghint'){const T=TG;if(!T)return;const left=T.tpx.map((_,i)=>i).filter(i=>!T.hints.has(i));if(left.length)T.hints.add(pick(left));return render()}
  if(a==='tglines'){if(TG)TG.lines=!TG.lines;return render()}
  if(a==='tgreset'){const T=TG;if(!T)return;const n=tgSetup(T.pz);if(W_&&W_.tg===T)W_.tg=n;else lab.tg=n;return render()}
  if(a==='tglv'){lab.tgLv=+b.dataset.k;lab.tg=null;return render()}
  if(a==='tgnew'){const c=TGP.filter(p=>p.lv===(lab.tgLv||0)&&(!lab.tg||p.n!==lab.tg.pz.n));lab.tg=tgSetup(pick(c));return render()}
  if(a==='exit'){cur=null;return render()}
  if(a==='exitMap'){cur=null;if(location.hash==='#map')render();else location.hash='map';return}
  if(a==='toHands'){const L=cur.L;lab.tool=L.tool;if(L.gt){lab.geo={pts:[],closed:false,task:Math.max(0,GT.findIndex(t=>t.t===L.gt)),an:null};lab.gmsg=''}cur.step='hands';render();return scrollTo(0,0)}
  if(a==='toQ'){cur.step='q';cur.t0=Date.now();render();return scrollTo(0,0)}
  if(a==='pick'){cur.sel=+b.dataset.i;if(cur.state==='retry')cur.shake=false;return render()}
  if(a==='check'){const c=cur,q=c.qs[c.i];if(q.draw?!c.cells.size:c.sel==null)return;const ok=q.draw?q.draw.check(c.cells):q.ch[c.sel].ok;
    if(c.tries===0){c.quick=Date.now()-c.t0<3000;c.res[c.i]={key:q.key,ok,quick:c.quick&&!ok,txt:strip(q.p)}}
    if(ok){c.state='right'}else if(c.tries===0){if(!q.draw){c.out[c.sel]='bad';c.sel=null}c.tries=1;c.state='retry';c.shake=true}else{if(!q.draw)c.out[c.sel]='bad';c.state='shown'}
    return render()}
  if(a==='nextQ'){const c=cur;if(c.i>=4)return finish();c.i++;c.sel=null;c.out={};c.cells=new Set();c.tries=0;c.state='';c.quick=false;c.t0=Date.now();render();return scrollTo(0,0)}
  if(a==='daily'){const d=S.daily[today()]||{};d[b.dataset.k]=!d[b.dataset.k];S.daily[today()]=d;const keys=Object.keys(S.daily).sort();if(keys.length>40)delete S.daily[keys[0]];save();return render()}
  if(a==='labShape'){lab.k=b.dataset.k;return labOp('reset')}
  if(a==='lop')return labOp(b.dataset.o);
  if(a==='dcell'){const k=ck(b.dataset.x,b.dataset.y);cur.cells.has(k)?cur.cells.delete(k):cur.cells.add(k);cur.shake=false;return render()}
  if(a==='dclear'){cur.cells=new Set();return render()}
  if(a==='tool'){lab.tool=b.dataset.k;return render()}
  if(a==='mfpick'){lab.mfSel=+b.dataset.i;return render()}
  if(a==='mfcheck'){const m=lab.mf,ok=m.ts[lab.mfSel]===m.ans;if(ok){if(lab.mfBad==null)lab.mfStreak++;lab.mfState='right'}else if(lab.mfBad==null){lab.mfBad=lab.mfSel;lab.mfSel=null;lab.mfState='retry';lab.mfStreak=0}else{lab.mfState='shown';lab.mfStreak=0}return render()}
  if(a==='mfnext'){lab.mf=newMF();lab.mfSel=null;lab.mfBad=null;lab.mfState='';return render()}
  if(a==='mcell'){const k=ck(b.dataset.x,b.dataset.y);lab.mdCells.has(k)?lab.mdCells.delete(k):lab.mdCells.add(k);return render()}
  if(a==='mdcheck'){lab.mdRes=true;lab.mdOk=setEq(lab.mdCells,lab.md.want);return render()}
  if(a==='mdretry'){lab.mdRes=false;return render()}
  if(a==='mdclear'){lab.mdCells=new Set();return render()}
  if(a==='mdnew'){lab.md=mirrorPuzzle();lab.mdCells=new Set();lab.mdRes=false;return render()}
  if(a==='gdot'){const g=lab.geo,x=+b.dataset.x,y=+b.dataset.y;lab.gmsg='';if(g.closed)return;
    if(g.pts.length>=3&&x===g.pts[0][0]&&y===g.pts[0][1]){g.closed=true;g.an=analyze(g.pts)}
    else if(g.pts.some(q=>q[0]===x&&q[1]===y))lab.gmsg='이미 찍은 점이에요. 도형을 닫으려면 노란 첫 점을 눌러요!';
    else if(g.pts.length===1&&x===g.pts[0][0]&&y===g.pts[0][1]){}else g.pts.push([x,y]);return render()}
  if(a==='gundo'){const g=lab.geo;lab.gmsg='';if(g.closed){g.closed=false;g.an=null}else g.pts.pop();return render()}
  if(a==='gclear'){lab.geo={...lab.geo,pts:[],closed:false,an:null};lab.gmsg='';return render()}
  if(a==='gnext'){lab.geo={pts:[],closed:false,task:(lab.geo.task+1)%GT.length,an:null};lab.gmsg='';return render()}
  if(a==='labBase'){lab.base=b.dataset.b;return render()}
  if(a==='toggleOpen'){S.open=!S.open;save();return render()}
  if(a==='askReset'){$('#modal').innerHTML=`<div class="modal"><div class="card q"><h3>기록을 모두 지울까요?</h3><p style="margin:0">별, 정답률, 틀린 문제 기록이 모두 사라지고 되돌릴 수 없어요.</p><div class="row"><button class="btn" style="background:var(--c);box-shadow:none" data-a="doReset">지우기</button><button class="btn ghost" data-a="closeM">취소</button></div></div></div>`;return}
  if(a==='pk')return pinDigit(b.dataset.k);
  if(a==='pkdel'){PIN.buf=PIN.buf.slice(0,-1);return render()}
  if(a==='pkx'){if(PIN.mode==='enter')return;PIN.buf='';if(S.pin){PIN.mode='';pinOK=true;pinT=Date.now()}else{PIN.mode='';location.hash='today'}return render()}
  if(a==='pinChange'){PIN.mode='create';PIN.buf='';PIN.msg='';return render()}
  if(a==='pinLock'){pinOK=false;PIN.mode='';return render()}
  if(a==='pkforgot'){
    if(FB&&FB.user){const pr=new FB.AU.GoogleAuthProvider();FB.AU.reauthenticateWithPopup(FB.user,pr).then(()=>{S.pin='';save();PIN.mode='create';PIN.buf='';PIN.msg='구글 계정 확인 완료! 새 비밀번호를 만들어요.';render()}).catch(()=>{PIN.msg='구글 계정 확인이 안 됐어요.';render()});return}
    $('#modal').innerHTML=`<div class="modal"><div class="card q"><h3>비밀번호를 지울까요?</h3><p style="margin:0">아직 로그인 연결 전이라 구글 계정으로 확인할 수 없어요. 지우면 새 비밀번호를 만들 수 있어요. (진도는 그대로예요)</p><div class="row"><button class="btn" data-a="pinWipe">지우기</button><button class="btn ghost" data-a="closeM">취소</button></div></div></div>`;return}
  if(a==='pinWipe'){S.pin='';save();PIN.mode='create';$('#modal').innerHTML='';return render()}
  if(a==='login')return login();
  if(a==='logout'){if(FB)FB.AU.signOut(FB.auth);return}
  if(a==='doReset'){S=blank();save();$('#modal').innerHTML='';return render()}
  if(a==='closeM'){$('#modal').innerHTML='';return}
});
document.addEventListener('change',e=>{if(e.target.id!=='gtask')return;lab.geo={pts:[],closed:false,task:+e.target.value,an:null};lab.gmsg='';render()});
document.addEventListener('input',e=>{if(e.target.id!=='angR')return;lab.ang=+e.target.value;const a=lab.ang;
  $('#angfig').innerHTML=protSVG(a,lab.base);$('#angv').textContent=a+'°';$('#angc').textContent=a===0?'0°':a<90?'예각':a===90?'직각':a<180?'둔각':'일직선 (180°)'});
const svgPt=(svg,e)=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const r=p.matrixTransform(svg.getScreenCTM().inverse());return[r.x,r.y]};
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('[data-tp]');if(!el||!TG||TG.solved)return;const svg=$('#tgsvg');if(!svg)return;e.preventDefault();
  const i=+el.dataset.tp,pc=TG.pieces[i],pt=svgPt(svg,e);drag={i,dx:pt[0]-pc.x,dy:pt[1]-pc.y,sx:pt[0],sy:pt[1],moved:false,wasSel:TG.sel===i};
  TG.sel=i;svg.querySelectorAll('.pc.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');el.parentNode.appendChild(el)});
document.addEventListener('pointermove',e=>{if(!drag||!TG)return;const svg=$('#tgsvg');if(!svg)return;const pt=svgPt(svg,e);if(!drag.moved&&Math.hypot(pt[0]-drag.sx,pt[1]-drag.sy)<5)return;drag.moved=true;e.preventDefault();
  const pc=TG.pieces[drag.i];pc.x=Math.max(0,Math.min(TG.W,pt[0]-drag.dx));pc.y=Math.max(0,Math.min(TG.H,pt[1]-drag.dy));const el=svg.querySelector(`[data-tp="${drag.i}"]`);if(el)el.setAttribute('points',PS(ptsOf(pc,TG.k)))},{passive:false});
const endDrag=()=>{if(!drag||!TG){drag=null;return}const d=drag;drag=null;const pc=TG.pieces[d.i];if(!d.moved&&d.wasSel)pc.rot=(pc.rot+1)%8;tgSnap(TG,d.i);tgDone(TG);render()};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
setInterval(()=>{if(!W_||W_.done)return;const left=Math.max(0,300-Math.floor((Date.now()-W_.t0)/1000));const el=$('#wtime');if(el)el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(left===0&&!W_.timeUp){W_.timeUp=true;if(!drag)render()}},1000);
window.addEventListener('hashchange',()=>{cur=null;W_=null;if(location.hash!=='#parent'){pinOK=false;PIN.mode='';PIN.buf=''}render();scrollTo(0,0)});
lab.ox=Math.floor((7-dims(lab.sh)[0])/2);lab.oy=Math.floor((7-dims(lab.sh)[1])/2);
render();initDB();


}
</script>
