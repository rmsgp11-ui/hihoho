<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리가족</title>
<meta name="theme-color" content="#e8553a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE: 냉장고 문에 붙여 둔 가족 게시판. 짧고 다정한 말, 칭찬은 구체적으로
   IDEA: 냉장고 문 — 자석 메모, 도장, 편지봉투, 동전이 차오르는 포인트 병
   PICTURE: 오늘 약속 진행 링, 차오르는 포인트 병, 이번 주 vs 지난주 막대
   COLOUR and TYPE: 크림 바탕, 토마토 주황 주색, 가족마다 고유색, 노랑 포인트 / Jua + Gowun Dodum
   LAYOUT: 위에 나, 아래 탭, 한 줄 카드. 휴대폰·태블릿 세로 우선 */
:root{color-scheme:light dark;
--bg:light-dark(#fff8ef,#1a1613);--card:light-dark(#ffffff,#26201b);--ink:light-dark(#2a2118,#f6efe6);--mute:light-dark(#7a6a5b,#b9a996);
--p:light-dark(#e8553a,#ff8a6b);--p2:light-dark(#ffeadf,#3b2620);--y:#ffc93c;--ok:light-dark(#178a5c,#47cf98);--okbg:light-dark(#e3f6ec,#173a2b);
--line:light-dark(#efdfcd,#3b3128);--sh:light-dark(rgba(120,60,20,.09),rgba(0,0,0,.45))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Gowun Dodum',system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,h3,.jua{font-family:'Jua',system-ui,sans-serif;font-weight:400;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5vw,40px)}h2{font-size:clamp(22px,3.4vw,28px)}h3{font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--y);outline-offset:2px}
input,select,textarea{font-size:17px;min-height:48px;border:2px solid var(--line);border-radius:14px;background:var(--bg);padding:8px 12px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--line)}
.tb{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:960px;margin:0 auto;padding:10px max(4vw,14px) 0}
.brand{display:flex;align-items:center;gap:8px;font-family:'Jua';font-size:24px}
.brand svg{width:32px;height:32px}
.me{display:flex;align-items:center;gap:8px;border:0;background:var(--p2);border-radius:99px;padding:4px 14px 4px 4px;min-height:44px;font-family:'Jua';font-size:18px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:'Jua';font-size:18px;flex:none}
.tabs{display:flex;gap:2px;max-width:960px;margin:6px auto 0;padding:0 max(4vw,10px);overflow-x:auto}
.tabs button{flex:none;border:0;background:none;padding:10px 12px 12px;font-family:'Jua';font-size:18px;color:var(--mute);border-bottom:4px solid transparent;min-height:48px;position:relative}
.tabs button.on{color:var(--p);border-color:var(--p)}
.badge{position:absolute;top:4px;right:0;min-width:20px;height:20px;border-radius:10px;background:var(--p);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px;font-family:system-ui}
main{max-width:960px;margin:0 auto;padding:20px max(4vw,14px) 80px;display:grid;gap:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,24px);box-shadow:0 5px 0 var(--sh);display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{justify-content:space-between}
.mute{color:var(--mute)}.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:0 22px;border-radius:16px;border:0;background:var(--p);color:#fff;font-family:'Jua';font-size:20px;box-shadow:0 4px 0 color-mix(in srgb,var(--p) 55%,#000)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.btn.ghost{background:var(--card);color:var(--p);border:2px solid var(--p);box-shadow:none}
.btn.sm{min-height:44px;font-size:17px;padding:0 14px}
.btn.ok{background:var(--ok);box-shadow:none}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{width:132px;height:132px}
.dclock{width:min(230px,100%);height:auto;display:block}
.thead{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;font-family:'Jua';font-size:15px;color:var(--mute);text-align:center}
.ttbl{position:relative;display:grid;grid-template-columns:34px 1fr 1fr;gap:6px;border-top:2px solid var(--line)}
.ttbl .tl{position:absolute;left:34px;right:0;height:0;border-top:1px dashed var(--line);font-style:normal}.ttbl .tl.hr{border-top:1px solid var(--line)}
.ttbl em{position:absolute;left:0;width:30px;text-align:right;font-style:normal;font-family:'Jua';font-size:14px;color:var(--mute);transform:translateY(-50%);line-height:1}.ttbl em small{display:block;font-size:10px}
.tcol{position:relative;grid-row:1}.tcol.p{grid-column:2}.tcol.a{grid-column:3}
.tblk{position:absolute;left:0;right:0;border-radius:10px;padding:3px 8px;overflow:hidden;font-size:14px;line-height:1.25;display:flex;flex-direction:column;justify-content:center;color:#3a2a1c;border:2px solid var(--card)}
.tblk b{font-family:'Jua';font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tblk span{font-size:12px;opacity:.8}
.tblk.sch{opacity:.85}.tblk.pl{background:repeating-linear-gradient(135deg,#d9cfc2 0 7px,#e6ddd2 7px 14px);cursor:pointer;color:#4a3b2c}
.tblk.pl.mine{background:repeating-linear-gradient(135deg,#bfe5cf 0 7px,#d4efe0 7px 14px);color:#1f4d35}
.tblk.pl.done{opacity:.45}.tblk.pl.done b::before{content:'✓ '}.tblk.run{outline:3px dashed var(--p);outline-offset:-3px;animation:blink 1.2s ease-in-out infinite}@keyframes blink{50%{outline-color:transparent}}
.tblk.ac{background:#ff9f80}.tblk.ac.run{cursor:pointer}
.tnow{position:absolute;left:28px;right:0;height:0;border-top:3px solid var(--p);z-index:3;font-style:normal}.tnow::before{content:'';position:absolute;left:-6px;top:-7px;width:11px;height:11px;border-radius:50%;background:var(--p)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cwd{text-align:center;font-family:'Jua';color:var(--mute);font-size:14px}.cwd.sun,.cday.sun b{color:var(--p)}
.cday{border:2px solid var(--line);background:var(--bg);border-radius:10px;min-height:58px;padding:3px;display:flex;flex-direction:column;align-items:center;gap:2px}.cday b{font-family:'Jua';font-weight:400;font-size:16px}.cday.today{border-color:var(--p)}.cday.sel{background:var(--p2);border-color:var(--p)}
.cdots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}.cdots i{font-style:normal;font-size:11px;border-radius:6px;padding:0 4px;color:#fff;background:#b9aa98}.cdots i.ok{background:var(--ok)}.cdots i.part{background:#ff9f80}.cdots i.miss{background:var(--p)}.cdots i.ca{background:#3d6ef0}
.tgap{text-align:center;font-family:'Jua';font-size:16px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin:2px 0}
.dclock .dbg{font-size:46px;text-anchor:middle;dominant-baseline:middle;opacity:.22;pointer-events:none}
.dclock .wedge{stroke:var(--card);stroke-width:1.5}.dclock .wedge.ghost{opacity:.75}.dclock .wedge.act{opacity:.95}
.dclock .dcnt{font-family:'Jua';font-size:24px;fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.dclock text,.dclock line,.dclock circle{pointer-events:none}
.dclock .dsub{font-size:12px;fill:var(--mute);text-anchor:middle;dominant-baseline:middle}
.ring .bgc{fill:none;stroke:var(--line);stroke-width:14}.ring .fg{fill:none;stroke:var(--p);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring text{font-family:'Jua';fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--p2);border-radius:99px;padding:6px 14px;font-family:'Jua';font-size:18px;white-space:nowrap}
.coin{width:22px;height:22px;flex:none}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:10px 12px;min-height:58px}
.task .bx{flex:none;width:30px;height:30px;border-radius:9px;border:3px solid var(--p);display:grid;place-items:center}
.task.on .bx{background:var(--ok);border-color:var(--ok)}.task.on .bx::after{content:'';width:8px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.task.on .tt{text-decoration:line-through;color:var(--mute)}
.task .tt{flex:1}
.task .pt{font-family:'Jua';color:var(--p);font-size:16px;white-space:nowrap}
.trow{display:grid;gap:8px}
.exbox{display:grid;gap:4px;justify-items:center;border:2px dashed var(--line);border-radius:14px;padding:8px}.exsvg{width:100%;max-width:300px;height:auto}.trow.out{opacity:.55}
.trow .btn.sm{min-height:42px;font-size:16px;padding:0 14px}
.g3t{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.strip i.g{background:repeating-linear-gradient(135deg,var(--line) 0 6px,color-mix(in srgb,var(--line) 55%,var(--bg)) 6px 12px);color:var(--mute);z-index:0}
.strip i.a{background:#ff9f80;top:auto;height:12px;bottom:0;z-index:2;border:0}
.lock{width:16px;height:16px;flex:none;fill:var(--mute)}
.x{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--mute);font-size:22px}
.list{display:grid;gap:8px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;min-width:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:0 12px;font-family:'Jua';font-size:17px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--p);background:var(--p2);color:var(--p)}
.chip .dot{width:12px;height:12px;border-radius:50%}
.done-msg{background:var(--okbg);border:2px solid var(--ok);border-radius:16px;padding:12px 14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:150px;padding-top:8px}
.wcol{display:grid;grid-template-rows:1fr auto;height:100%;gap:4px;text-align:center}
.wbars{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%}
.wbars i{display:block;width:40%;max-width:16px;border-radius:6px 6px 2px 2px;min-height:3px}
.wbars .lw{background:var(--line)}.wbars .tw{background:var(--p)}
.wcol span{font-size:13px;color:var(--mute)}.wcol.today span{color:var(--p);font-weight:bold}
.legend{display:flex;gap:14px;font-size:14px;color:var(--mute)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.big{font-family:'Jua';font-size:clamp(36px,7vw,52px);line-height:1}
.jar{width:120px;height:150px;flex:none}
.rw{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--bg)}
.rw .nm{flex:1;font-family:'Jua';font-size:19px}
.st{font-size:13px;border-radius:99px;padding:2px 10px;white-space:nowrap}
.st.wait{background:#fff1c7;color:#7a5600}.st.ok{background:var(--okbg);color:var(--ok)}.st.no{background:var(--line);color:var(--mute)}
.env{display:grid;gap:6px;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--bg);text-align:left;width:100%}
.env.unread{border-color:var(--p);background:var(--p2)}
.env .hd{display:flex;align-items:center;gap:8px;font-family:'Jua';font-size:18px}
.env .bd{white-space:pre-wrap;font-size:18px;line-height:1.6}
.food{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.fd{border:2px solid var(--line);border-radius:18px;padding:12px;background:var(--bg);display:grid;gap:8px}
.fd .nm{font-family:'Jua';font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.fd.eaten{opacity:.55}
.kid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.kid .ring{width:96px;height:96px}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;height:44px;align-items:end}
.mini i{display:block;background:var(--p);border-radius:4px 4px 1px 1px;min-height:2px;opacity:.85}
.slot{display:grid;grid-template-columns:7.2em minmax(0,1fr) auto;gap:10px;align-items:center;border-left:5px solid var(--p);background:var(--bg);border-radius:10px;padding:8px 10px}
.slot .tm{font-variant-numeric:tabular-nums;color:var(--mute);font-size:15px;white-space:nowrap}
.slot .ti{font-family:'Jua';font-size:18px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:minmax(0,1fr) 6em;gap:8px}
.modal{position:fixed;inset:0;background:rgba(30,20,10,.5);display:grid;place-items:center;z-index:30;padding:18px;overflow-y:auto}.modal .card{margin:auto 0}
.modal .card{max-width:440px;width:100%}
.full{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:40;padding:20px;overflow:auto}
.full .card{max-width:420px;width:100%;text-align:center;justify-items:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:50;font-size:16px;max-width:90vw}
.pdots{display:flex;gap:14px}.pdots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--p)}.pdots i.f{background:var(--p)}
.pkeys{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pkeys button{height:62px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-family:'Jua';font-size:28px}
.colors{display:flex;gap:10px;flex-wrap:wrap}.colors button{width:44px;height:44px;border-radius:50%;border:3px solid transparent}.colors button.on{border-color:var(--ink)}
.empty{color:var(--mute);text-align:center;padding:14px;border:2px dashed var(--line);border-radius:16px}
.sec{font-family:'Jua';font-size:16px;color:var(--mute);display:flex;align-items:center;gap:6px}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;text-align:left}
input[type=time]::-webkit-date-and-time-value,input[type=date]::-webkit-date-and-time-value{text-align:left}
label{display:grid;gap:4px;min-width:0}
.clock{width:100%;max-width:360px;height:auto;display:block;margin:0 auto}
.cface{fill:var(--bg);stroke:var(--line);stroke-width:3}
.wedge{stroke:var(--card);stroke-width:2}
.wedge.running{stroke:var(--p);stroke-width:3;stroke-dasharray:5 4;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-18}}
.wedge.gdone{opacity:.45}
.wl{font-family:'Jua',system-ui,sans-serif;font-size:14px;fill:#3a2a1c;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:rgba(255,255,255,.55);stroke-width:3px}
.hl{font-size:12px;fill:var(--mute);text-anchor:middle;dominant-baseline:middle}.hl.mj{font-family:'Jua';font-size:15px;fill:var(--ink)}
.ht{stroke:var(--mute);stroke-width:1}.ht.mj{stroke-width:2.5;stroke:var(--ink)}
.hand{stroke:var(--p);stroke-width:3;stroke-linecap:round}
.sw{width:14px;height:14px;border-radius:4px;flex:none;display:inline-block;vertical-align:-2px;margin-right:6px}
.strip{position:relative;height:46px;border-radius:12px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.strip i{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:'Jua';font-size:14px;color:#3a2a1c;white-space:nowrap;overflow:hidden;border-right:2px solid var(--card)}
.strip .now{position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1px;background:var(--p);border-radius:2px}
.sticks{position:relative;height:16px;font-size:12px;color:var(--mute)}.sticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
@media(max-width:600px){.hero{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}.hero .row{justify-content:center}.g2{grid-template-columns:minmax(0,1fr)}.slot{grid-template-columns:6.2em minmax(0,1fr) auto}.tabs button{padding:10px 9px 12px;font-size:17px}}
@media(prefers-reduced-motion:reduce){.ring .fg{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>
<header class="top">
  <div class="tb">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--p)"/><path d="M7 15 L16 7 L25 15 V25 H7 Z" fill="#fff"/><path d="M16 22.5c-2.8-2-4.6-3.6-4.6-5.4 0-1.3 1-2.2 2.2-2.2.9 0 1.7.5 2.4 1.4.7-.9 1.5-1.4 2.4-1.4 1.2 0 2.2.9 2.2 2.2 0 1.8-1.8 3.4-4.6 5.4z" fill="var(--p)"/></svg>우리가족</div>
    <div id="mebox"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"><div class="card"><p>불러오는 중…</p></div></main>
<div id="modal"></div><div id="full"></div><div id="toastbox"></div>
<script>
{
/* ---------- 도구 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ds(d)};
const wdOf=s=>new Date(s+'T00:00:00').getDay();
const WD=['일','월','화','수','목','금','토'];const MON=[1,2,3,4,5,6,0];
const monday=s=>addDays(s,-((wdOf(s)+6)%7));
const fmtD=s=>{const d=new Date(s+'T00:00:00');return`${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`};
const ago=t=>{const m=Math.floor((Date.now()-t)/60000);return m<1?'방금':m<60?m+'분 전':m<1440?Math.floor(m/60)+'시간 전':Math.floor(m/1440)+'일 전'};
const COLORS=['#e8553a','#3d6ef0','#22a06b','#9b5de5','#ff8a3d','#17a2b8','#d6407a','#8a6a2f'];
const COIN='<svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffc93c" stroke="#c99400" stroke-width="2"/><text x="12" y="16.5" text-anchor="middle" font-size="12" font-family="Jua" fill="#7a5600">P</text></svg>';
const LOCK='<svg class="lock" viewBox="0 0 16 16" aria-label="부모님이 정한 할 일"><path d="M4 7V5a4 4 0 0 1 8 0v2h1v8H3V7zm2 0h4V5a2 2 0 0 0-4 0z"/></svg>';
function toast(m){$('#toastbox').innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toastbox').innerHTML='',2600)}

/* ---------- 상태 ---------- */
const ST={me:'',role:'',ready:false,members:{},cfg:{rewards:[],ownPt:2,ownMax:3,pin:''},tpl:{},plan:{},done:{},sched:{},lettersTo:[],lettersFrom:[],lettersAll:[],food:[],redeem:[],bonus:[],wish:[],justWish:false,
  selKid:'',selDate:'',selMember:'',selDay:wdOf(today()),letterTo:'',justSent:null,openLetter:'',showAll:false,newDays:[1,2,3,4,5],schedDays:null,color:''};
const name=e=>(ST.members[e]&&ST.members[e].name)||e.split('@')[0];
const color=e=>(ST.members[e]&&ST.members[e].color)||'#999';
const av=(e,sz)=>`<span class="av" style="background:${color(e)};${sz?`width:${sz}px;height:${sz}px;font-size:${sz/2}px`:''}">${esc(name(e).slice(0,1))}</span>`;
const kids=()=>Object.keys(ST.members).filter(e=>ST.members[e].role==='kid').sort((a,b)=>name(a).localeCompare(name(b)));
const fam=()=>Object.keys(ST.members).sort((a,b)=>(ST.members[a].role===ST.members[b].role?0:ST.members[a].role==='admin'?-1:1)||name(a).localeCompare(name(b)));
const isAdmin=()=>ST.role==='admin';

/* ---------- 할 일·포인트 계산 ---------- */
function itemsFor(K,date){const wd=wdOf(date);const t=((ST.tpl[K]&&ST.tpl[K].items)||[]).filter(i=>(i.days||[]).includes(wd));const p=((ST.plan[K]&&ST.plan[K][date]&&ST.plan[K][date].items)||[]);return[...t,...p,...(doneDoc(K,date).moved||[])]}
const doneDoc=(K,date)=>(ST.done[K]&&ST.done[K][date])||{p:{},own:[]};
const isOut=(d,i)=>!!(d.out&&d.out[i.id]);
const tmOf=(d,i)=>(d.re&&d.re[i.id])||i.at||'';
const countItems=(K,date)=>{const d=doneDoc(K,date);return itemsFor(K,date).filter(i=>!isOut(d,i))};
const hmOf=ts=>{const x=new Date(ts);return pad(x.getHours())+':'+pad(x.getMinutes())};
const nowMin=()=>{const x=new Date();return x.getHours()*60+x.getMinutes()};
const sg=g=>Array.isArray(g)?{s:g[0],e:g[1]}:(g||{s:0,e:0});const runMs=r=>((r&&r.segs)||[]).map(sg).reduce((a,g)=>a+(g.e-g.s),0)+(r&&r.cur?Date.now()-r.cur:0);
const AUTO={dohyung:'도형교실 수업 1개 끝내면',gugudan:'구구단 오늘의 미션 끝내면',korean:'국어 훈련 끝내면',kbook:'국어 문제집 한 문장 끝내면'};
const autoOn=(d,i)=>!!(i.auto&&d.auto&&d.auto[i.auto]);
const isDone=(d,i)=>!!((d.p&&d.p[i.id])||autoOn(d,i));
function dayCount(K,date){const d=doneDoc(K,date);const items=countItems(K,date);const pd=items.filter(i=>isDone(d,i)).length;const od=(d.own||[]).filter(o=>o.done).length;return{pd,pt:items.length,od,all:pd+od}}
function dayCountHist(K,date){const d=doneDoc(K,date);const ex=itemsFor(K,date).filter(i=>autoOn(d,i)&&!(d.p&&d.p[i.id])).length;return Object.keys(d.p||{}).length+ex+(d.own||[]).filter(o=>o.done).length}
function points(K){let e=0,fe=0;const own=ST.cfg.ownPt??2,mx=ST.cfg.ownMax??3;
  for(const d of Object.values(ST.done[K]||{})){for(const v of Object.values(d.p||{}))e+=+v.pt||0;if(d.date&&d.auto)itemsFor(K,d.date).forEach(i=>{if(autoOn(d,i)&&!(d.p&&d.p[i.id]))e+=+i.pt||0});e+=Math.min((d.own||[]).filter(o=>o.done).length,mx)*own;fe+=(d.fee||[]).reduce((a,x)=>a+(+x.pt||0),0);if(d.box)e+=Math.min(10,Math.max(0,+d.box.pt||0))}
  e+=ST.bonus.filter(b=>b.who===K).reduce((s,b)=>s+(+b.pt||0),0);
  const sp=ST.redeem.filter(r=>r.by===K&&r.status!=='no').reduce((s,r)=>s+(+r.cost||0),0);return{earned:e,spent:sp,fee:fe,bal:e-sp-fe}}
function weekData(K){const m=monday(today());const tw=[],lw=[];for(let i=0;i<7;i++){tw.push(dayCountHist(K,addDays(m,i)));lw.push(dayCountHist(K,addDays(m,i-7)))}return{tw,lw,ts:tw.reduce((a,b)=>a+b,0),ls:lw.reduce((a,b)=>a+b,0)}}

/* ---------- 그림 ---------- */
function ring(done,total,sz){const r=52,c=2*Math.PI*r,f=total?done/total:0;return`<svg class="ring" viewBox="0 0 132 132" role="img" aria-label="약속 ${done}/${total} 지킴"><circle class="bgc" cx="66" cy="66" r="${r}"/><circle class="fg" cx="66" cy="66" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-f)).toFixed(1)}" transform="rotate(-90 66 66)" style="stroke:${f>=1?'var(--ok)':'var(--p)'}"/><text x="66" y="60" font-size="${sz||34}">${done}/${total}</text><text x="66" y="88" font-size="14" style="font-family:'Gowun Dodum';fill:var(--mute)">약속</text></svg>`}
function jar(bal,goal){const f=Math.max(0,Math.min(1,goal?bal/goal:0));const top=40,bot=140,h=(bot-top)*f;let coins='';const n=Math.round(f*14);for(let i=0;i<n;i++){const row=Math.floor(i/4),col=i%4;coins+=`<circle cx="${32+col*19+(row%2?9:0)}" cy="${bot-10-row*16}" r="8" fill="#ffc93c" stroke="#c99400" stroke-width="1.5"/>`}
  return`<svg class="jar" viewBox="0 0 120 150" role="img" aria-label="포인트 병"><rect x="34" y="8" width="52" height="16" rx="5" fill="var(--p)"/><path d="M28 26 h64 q8 0 8 10 v96 q0 12 -12 12 h-56 q-12 0 -12 -12 v-96 q0 -10 8 -10z" fill="color-mix(in srgb,var(--p) 8%,transparent)" stroke="var(--line)" stroke-width="4"/><rect x="24" y="${(bot-h).toFixed(1)}" width="72" height="${h.toFixed(1)}" rx="8" fill="#ffc93c" opacity=".35"/>${coins}<path d="M38 40 v70" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".5"/></svg>`}
function weekBars(K){const w=weekData(K);const mx=Math.max(1,...w.tw,...w.lw);const t=wdOf(today());
  return`<div class="week">${MON.map((wd,i)=>`<div class="wcol ${wd===t?'today':''}"><div class="wbars"><i class="lw" style="height:${(w.lw[i]/mx*100).toFixed(0)}%" title="지난주 ${w.lw[i]}개"></i><i class="tw" style="height:${(w.tw[i]/mx*100).toFixed(0)}%" title="이번 주 ${w.tw[i]}개"></i></div><span>${WD[wd]}</span></div>`).join('')}</div>
  <div class="row sp"><div class="legend"><span><i style="background:var(--line)"></i>지난주</span><span><i style="background:var(--p)"></i>이번 주</span></div><span class="small">이번 주 <b>${w.ts}개</b> · 지난주 ${w.ls}개 ${w.ts>w.ls?`<b style="color:var(--ok)">(+${w.ts-w.ls})</b>`:''}</span></div>`}
function miniBars(K){const w=weekData(K);const mx=Math.max(1,...w.tw);return`<div class="mini">${w.tw.map(v=>`<i style="height:${(v/mx*100).toFixed(0)}%"></i>`).join('')}</div>`}

/* ---------- Firebase ---------- */
const FV='https://www.gstatic.com/firebasejs/10.12.2/';
let F=null;const SUBS={};let rq=0;
function sched(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
function sub(key,ref,cb){if(SUBS[key]||!F)return;SUBS[key]=F.FS.onSnapshot(ref,s=>{cb(s);sched()},e=>{console.warn(key,e&&e.code);if(key==='members'&&e&&e.code==='permission-denied')gate('<b>'+esc(ST.me)+'</b> 계정은 가족 목록에 없어요. 다른 구글 계정으로 로그인해 주세요.<br><span class="small mute">(확인 코드 A: 가족 목록 읽기 거부)</span>',true)})}
const arr=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const D=(...p)=>F.FS.doc(F.db,...p),C=(...p)=>F.FS.collection(F.db,...p),Q=(c,...w)=>F.FS.query(c,...w.map(x=>F.FS.where(...x)));
const save=(p,ref,data,merge)=>F.FS.setDoc(ref,data,merge?{merge:true}:undefined).catch(e=>toast('저장이 안 됐어요 ('+(e&&e.code)+')'));
function gate(msg,denied){$('#full').innerHTML=`<div class="full"><div class="card"><h1>우리가족</h1><p style="margin:0">가족 모두의 할 일, 편지, 먹고 싶은 것을<br>한곳에 모아요.</p>${msg?`<div class="done-msg" style="background:var(--p2);border-color:var(--p);text-align:left">${msg}</div>`:''}<button class="btn" data-a="login">Google로 로그인</button>${denied?'<button class="btn ghost sm" data-a="logout">다른 계정으로</button>':''}<p class="small mute" style="margin:0">카카오톡 안 브라우저에서는 로그인이 안 돼요. <b>Chrome</b>으로 열어 주세요.</p></div></div>`}
async function boot(){
  const cfg=window.firebaseConfig;if(!window.__MOCK_FB&&(!cfg||!cfg.apiKey)){$('#app').innerHTML='<div class="card"><p>Firebase 설정(config.js)이 없어요.</p></div>';return}
  try{let A,AU,FS;if(window.__MOCK_FB)({A,AU,FS}=window.__MOCK_FB);else{A=await import(FV+'firebase-app.js');AU=await import(FV+'firebase-auth.js');FS=await import(FV+'firebase-firestore.js')}
    const app=A.initializeApp(cfg||{});F={AU,FS,auth:AU.getAuth(app),db:FS.getFirestore(app)};$('#full').innerHTML='<div class="full"><div class="card"><h1>우리가족</h1><p class="mute" style="margin:0">로그인 확인 중…</p></div></div>';
    AU.onAuthStateChanged(F.auth,u=>{for(const k in SUBS){SUBS[k]();delete SUBS[k]}Object.assign(ST,{me:'',role:'',ready:false,members:{},tpl:{},plan:{},done:{},sched:{},lettersTo:[],lettersFrom:[],lettersAll:[],food:[],redeem:[],bonus:[],wish:[],justWish:false,selKid:'',selDate:'',selMember:'',justSent:null,openLetter:'',showAll:false,schedDays:null});unlocked=false;PIN.mode='';
      if(!u){gate('');return}
      ST.me=(u.email||'').toLowerCase();$('#full').innerHTML='';
      sub('members',C('members'),s=>{ST.members={};s.forEach(d=>ST.members[d.id]=d.data());ST.ready=true;const m=ST.members[ST.me];if(m&&!m.nt)ensureTopic();if(m){if(ST.role&&ST.role!==m.role){for(const k in SUBS)if(k!=='members'&&k!=='cfg'){SUBS[k]();delete SUBS[k]}}ST.role=m.role;startRole()}else{ST.role='';checkLock()}});
      sub('cfg',D('fam','cfg'),s=>{ST.cfg=Object.assign({rewards:[],ownPt:2,ownMax:3,pin:''},s.exists()?s.data():{});checkLock()});
      render();});
  }catch(e){$('#app').innerHTML='<div class="card"><p>연결이 안 됐어요. 인터넷을 확인하고 새로고침해 주세요.</p></div>'}
}
function startRole(){const t=today();
  if(ST.role==='kid'){const K=ST.me;subKid(K,t);
    sub('sched:'+K,D('sched',K),s=>{ST.sched[K]=s.exists()?s.data():{items:[]}});
    sub('lto',Q(C('letters'),['to','==',K]),s=>ST.lettersTo=arr(s));
    sub('lfrom',Q(C('letters'),['from','==',K]),s=>ST.lettersFrom=arr(s));
    sub('redeem',Q(C('redeem'),['by','==',K]),s=>ST.redeem=arr(s));
    sub('bonus',Q(C('bonus'),['who','==',K]),s=>ST.bonus=arr(s));
    sub('wish',Q(C('wish'),['by','==',K]),s=>ST.wish=arr(s));
  }else{kids().forEach(K=>subKid(K,t));
    sub('schedAll',C('sched'),s=>{s.forEach(d=>ST.sched[d.id]=d.data())});
    sub('letters',C('letters'),s=>ST.lettersAll=arr(s));
    sub('redeem',C('redeem'),s=>ST.redeem=arr(s));
    sub('bonus',C('bonus'),s=>ST.bonus=arr(s));
    sub('wish',C('wish'),s=>ST.wish=arr(s));}
  sub('food',C('food'),s=>ST.food=arr(s));checkLock()}
function subKid(K,t){sub('tpl:'+K,D('tpl',K),s=>{ST.tpl[K]=s.exists()?s.data():{items:[]};if(isAdmin()){hashOf(K);setTimeout(()=>seedLinks(K),300)}});subPlan(K,t);
  sub('done:'+K,C('done',K,'days'),s=>{const o={};s.forEach(d=>o[d.id]=d.data());ST.done[K]=o})}
function subPlan(K,date){sub('plan:'+K+':'+date,D('plan',K,'days',date),s=>{(ST.plan[K]=ST.plan[K]||{})[date]=s.exists()?s.data():{items:[]}})}
const myLetters=()=>isAdmin()?ST.lettersAll.filter(l=>l.to===ST.me):ST.lettersTo;
const mySent=()=>isAdmin()?ST.lettersAll.filter(l=>l.from===ST.me):ST.lettersFrom;
const unread=()=>myLetters().filter(l=>!l.read).length;

/* ---------- 관리자 잠금 ---------- */
let unlocked=false,hiddenAt=0,PIN={buf:'',mode:'',first:'',msg:''};
async function hashPin(x){const t='family:'+x;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))|0;return'h'+h}}
const TKEY=()=>'fam-trust-'+ST.me;
function trusted(){try{return!!ST.cfg.pin&&localStorage.getItem(TKEY())===ST.cfg.pin}catch(e){return false}}
function trust(on){try{on?localStorage.setItem(TKEY(),ST.cfg.pin||''):localStorage.removeItem(TKEY())}catch(e){}}
function checkLock(){if(!isAdmin()){PIN.mode='';PIN.buf=''}else if(trusted()){unlocked=true;if(PIN.mode==='enter')PIN.mode=''}else if(ST.cfg.pin&&!unlocked&&!PIN.mode)PIN.mode='enter';paintPin()}
function paintPin(){if(!PIN.mode){if($('#full').dataset.pin){$('#full').innerHTML='';delete $('#full').dataset.pin}return}
  const m=PIN.mode,t=m==='enter'?'관리자 비밀번호':m==='create'?'관리자 비밀번호 만들기':'한 번 더 눌러 주세요';
  $('#full').dataset.pin='1';$('#full').innerHTML=`<div class="full"><div class="card"><h2>${t}</h2><p class="mute" style="margin:0">${m==='enter'?'부모님만 들어갈 수 있어요.':'숫자 4자리. 아이들이 모르는 번호로!'}</p><div class="pdots">${[0,1,2,3].map(i=>`<i class="${i<PIN.buf.length?'f':''}"></i>`).join('')}</div><div style="min-height:24px;color:var(--p)">${PIN.msg}</div><div class="pkeys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-a="pk" data-k="${n}">${n}</button>`).join('')}<button data-a="pkx" style="font-size:16px">${m==='enter'?'':'취소'}</button><button data-a="pk" data-k="0">0</button><button data-a="pkdel" aria-label="지우기">⌫</button></div></div></div>`}
async function pinKey(k){if(PIN.buf.length>=4)return;PIN.buf+=k;PIN.msg='';paintPin();if(PIN.buf.length<4)return;const v=PIN.buf;PIN.buf='';
  if(PIN.mode==='create'){PIN.first=v;PIN.mode='confirm'}
  else if(PIN.mode==='confirm'){if(v===PIN.first){unlocked=true;PIN.mode='';const h=await hashPin(v);await save('',D('fam','cfg'),{pin:h,pinOff:false},true);ST.cfg.pin=h;trust(true);toast('관리자 비밀번호를 만들었어요. 이 기기에서는 다시 묻지 않아요')}else{PIN.mode='create';PIN.msg='두 번 누른 번호가 달라요'}}
  else{if(await hashPin(v)===ST.cfg.pin){unlocked=true;PIN.mode='';trust(true);toast('이 기기에서는 다시 묻지 않아요')}else PIN.msg='번호가 틀렸어요'}
  paintPin();render()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>10*60*1000&&!trusted()){unlocked=false;checkLock()}});

/* ---------- 약속 시간 · 타이머 · 미루기 · 인증 ---------- */

  for(let i=0;i<7;i++){const d0=addDays(m,i);if(d0>t)break;const d=doneDoc(K,d0),it=countItems(K,d0),dn=it.filter(x=>isDone(d,x)).length;pd+=dn;pt+=it.length;days.push(`${WD[wdOf(d0)]} ${dn}/${it.length}`);

function habitFacts(K,ws){const t=today(),o={pd:0,pt:0,timed:0,ontime:0,lateSum:0,lateN:0,moves:0,mins:0,days:[],items:{}};
  for(let i=0;i<7;i++){const d0=addDays(ws,i);if(d0>t)break;const d=doneDoc(K,d0),used=!!(ST.done[K]&&ST.done[K][d0]);const it=countItems(K,d0);let dn=0;
    if(!used&&d0<t){o.days.push({d:d0,dn:0,n:it.length,none:1});continue}
    it.forEach(x=>{const r=o.items[x.t]=o.items[x.t]||{n:0,done:0,late:0,lateSum:0,moves:0};r.n++;const ok=isDone(d,x);if(ok){r.done++;dn++}
      const tm=tmOf(d,x),rr=(d.run||{})[x.id],s0=rr&&rr.segs&&rr.segs.length?sg(rr.segs[0]):(rr&&rr.cur?{s:rr.cur}:null);
      if(tm&&s0){o.timed++;const st=new Date(s0.s),lm=st.getHours()*60+st.getMinutes()-toMin(x.at||tm);if(lm<=10)o.ontime++;else{o.lateSum+=lm;o.lateN++;r.late++;r.lateSum+=lm}}o.mins+=Math.round(runMs(rr)/60000)});
    (d.fee||[]).forEach(f=>{o.moves++;const r=o.items[f.t]=o.items[f.t]||{n:0,done:0,late:0,lateSum:0,moves:0};r.moves++});
    o.pd+=dn;o.pt+=it.length;o.days.push({d:d0,dn,n:it.length})}
  o.lateAvg=o.lateN?Math.round(o.lateSum/o.lateN):0;
  const L=Object.entries(o.items).map(([t,r])=>({t,...r,rate:r.n?r.done/r.n:1}));
  o.missed=L.filter(x=>x.n&&x.done<x.n).sort((a,b)=>a.rate-b.rate||b.n-a.n).slice(0,3);
  o.late=L.filter(x=>x.late).sort((a,b)=>b.lateSum/b.late-a.lateSum/a.late).slice(0,3).map(x=>({...x,avg:Math.round(x.lateSum/x.late)}));
  o.moved=L.filter(x=>x.moves).sort((a,b)=>b.moves-a.moves).slice(0,3);return o}

  if(a==='sendL'){const t=$('#lText')&&$('#lText').value.trim();if(!t)return toast('편지 내용을 적어 주세요');const to=ST.letterTo;b.disabled=true;try{await F.FS.addDoc(C('letters'),{from:ST.me,to,text:t,read:false,at:Date.now()});$('#lText').value='';render(true);toast(`${name(to)}에게 편지를 보냈어요`);push(to,'비밀편지 도착',`${name(ST.me)}에게서 편지가 왔어요. 열어 보세요!`,true)}catch(er){toast('보내기가 안 됐어요');b.disabled=false}return}
  if(a==='notify'){const to=ST.justSent&&ST.justSent.to;if(!to)return;await push(to,'비밀편지 도착',`${name(ST.me)}에게서 편지가 왔어요. 열어 보세요!`);ST.justSent=null;return render(true)}
  if(a==='sentOk'){ST.justSent=null;return render(true)}
  if(a==='openL'){ST.openLetter=ST.openLetter===id?'':id;const l=myLetters().find(x=>x.id===id);if(l&&!l.read)F.FS.updateDoc(D('letters',id),{read:true}).catch(()=>{});return render(true)}
  if(a==='toggleAll'){ST.showAll=!ST.showAll;return render(true)}
  /* 음식 */
  if(a==='foodAdd'){const n=val('foodIn');if(!n)return;$('#foodIn').value='';await F.FS.addDoc(C('food'),{by:ST.me,name:n,at:Date.now(),done:false,likes:[]}).catch(()=>toast('저장이 안 됐어요'));return render(true)}
  if(a==='foodLike'){const f=ST.food.find(x=>x.id===id);if(!f)return;const lk=f.likes||[];return F.FS.updateDoc(D('food',id),{likes:lk.includes(ST.me)?lk.filter(x=>x!==ST.me):[...lk,ST.me]}).catch(()=>toast('저장이 안 됐어요'))}
  if(a==='foodDone'){const f=ST.food.find(x=>x.id===id);if(!f)return;return F.FS.updateDoc(D('food',id),{done:!f.done}).catch(()=>toast('저장이 안 됐어요'))}
  if(a==='foodDel'){return F.FS.deleteDoc(D('food',id)).catch(()=>toast('지우기가 안 됐어요'))}
});
document.addEventListener('change',e=>{const as=e.target.dataset&&e.target.dataset.autosel;if(as){const K=ST.selKid,items=JSON.parse(JSON.stringify((ST.tpl[K]&&ST.tpl[K].items)||[]));const it=items.find(x=>x.id===as);if(it){const v=e.target.value;it.proof=v==='proof';it.auto=v==='proof'?'':v;if(it.proof&&!it.dur)it.dur=30;save('',D('tpl',K),{items},true);toast(it.proof?'타이머와 인증 사진으로 확인해요':it.auto?'앱 자동 체크를 연결했어요':'직접 체크로 바꿨어요')}return}
  const tf=e.target.dataset&&e.target.dataset.tplf;if(tf){const K=ST.selKid,items=JSON.parse(JSON.stringify((ST.tpl[K]&&ST.tpl[K].items)||[]));const it=items.find(x=>x.id===e.target.dataset.id);if(it){const v=e.target.value;if(tf==='pt')it.pt=Math.max(0,+v||0);if(tf==='at')it.at=v;if(tf==='dur')it.dur=Math.max(0,+v||0);if(tf==='lu')it.lu=v;if(tf==='at'&&v&&!it.dur)it.dur=30;save('',D('tpl',K),{items},true).then(()=>toast(tf==='pt'?`포인트를 ${it.pt}로 바꿨어요`:tf==='lu'?'링크를 연결했어요':'시간을 바꿨어요'))}return}
  const ps=e.target.dataset&&e.target.dataset.pstart;if(ps){const f=e.target.files&&e.target.files[0];if(f)startWithPhoto(ps,f);return}
  const pf=e.target.dataset&&e.target.dataset.proof;if(pf){const f=e.target.files&&e.target.files[0];if(f)sendProof(pf,f);return}if(e.target.id==='planDate'){ST.selDate=e.target.value||today();render(true)}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const m={ownIn:'ownAdd',foodIn:'foodAdd',tplT:'tplAdd',planT:'planAdd',schT:'schAdd',rwN:'rwAdd'}[e.target.id];if(m){e.preventDefault();const btn=document.querySelector(`[data-a="${m}"]`);if(btn)btn.click()}});
window.addEventListener('hashchange',()=>{render(true);scrollTo(0,0)});
boot();
}
</script>
