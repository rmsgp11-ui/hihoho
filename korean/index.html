<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>국어 훈련장</title>
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="../config.js"></script>
<script src="days.js"></script>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* 원고지 노트: 연한 원고지 칸 바탕, 초록 칸선 accent, 연필 노랑 보조. 한 화면 한 과제. */
:root{
  --paper:#f5f8f3; --card:#ffffff; --ink:#1f2e28; --soft:#5b6e66; --line:#d3e2d8;
  --grid:#e2ede5; --green:#2f7d5b; --green-ink:#ffffff; --pencil:#f2c14e; --pencil-ink:#3a2c05;
  --ok:#2f7d5b; --nudge:#b9711f; --nudge-bg:#fbf1e2;
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121a16; --card:#1a2520; --ink:#e3ece7; --soft:#9fb4aa; --line:#2c3d35;
  --grid:#1f2c26; --green:#5fb48d; --green-ink:#0d1a14; --pencil:#e9b949; --pencil-ink:#2a2006;
  --ok:#6cc39b; --nudge:#e2a65a; --nudge-bg:#2c2418; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121a16; --card:#1a2520; --ink:#e3ece7; --soft:#9fb4aa; --line:#2c3d35;
  --grid:#1f2c26; --green:#5fb48d; --green-ink:#0d1a14; --pencil:#e9b949; --pencil-ink:#2a2006;
  --ok:#6cc39b; --nudge:#e2a65a; --nudge-bg:#2c2418; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header.top h1{font-size:28px}
.stars{font-family:var(--f-display);background:var(--pencil);color:var(--pencil-ink);padding:4px 12px;border-radius:999px;font-size:16px}
nav.tabs{display:flex;gap:6px;margin-bottom:16px}
nav.tabs button{flex:1;font:inherit;font-family:var(--f-display);font-size:16px;padding:9px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.day{font:inherit;font-family:var(--f-display);font-size:15px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 4px;cursor:pointer;line-height:1.2}
.day small{display:block;font-family:var(--f-body);font-size:12px;color:var(--soft);margin-top:3px}
.day.done{border-color:var(--green)}
.day.done small{color:var(--ok)}
.day.next{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.day.next small{color:var(--green-ink)}
.weeks{display:grid;gap:12px;margin-top:12px}
.week .wk{font-size:14.5px;color:var(--soft);margin-bottom:4px}
.week .wk b{font-family:var(--f-display);font-weight:400;color:var(--ink)}
.week.cur .wk b{color:var(--green)}
.week .days{margin-top:0}
.day:disabled{opacity:.4;cursor:default}
.field{font:inherit;font-size:17px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%;margin:4px 0 12px}
.field.num{width:5.5em;margin:0;text-align:center;font-variant-numeric:tabular-nums}
.pg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.pg label{width:100%}
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:6px 0 4px}
.timer span{font-family:var(--f-display);font-size:40px;color:var(--green);font-variant-numeric:tabular-nums;min-width:3.2em}
.swap{margin:4px 0 10px}
.swap .field{margin-top:6px}
.books{display:grid;gap:10px;margin-top:10px}
.book{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:3px;font-size:15.5px}
.book b{font-family:var(--f-display);font-weight:400;font-size:17px}
.tag{font-size:12.5px;padding:1px 8px;border-radius:999px;background:var(--grid);color:var(--soft);margin-left:4px}
[hidden]{display:none!important}
.eword{font-family:"Gowun Dodum",sans-serif;font-size:34px;letter-spacing:.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.say{font:inherit;font-size:20px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px;cursor:pointer}
.opt.idk{color:var(--soft);border-style:dashed}
.card{border:2px solid var(--green);border-radius:16px;padding:14px 16px;margin-top:12px;background:color-mix(in srgb,var(--green) 6%,var(--card))}
.card .eword{font-size:30px}
.card .emean{font-family:var(--f-display);font-size:24px;color:var(--green);margin:4px 0}
.wbar{height:14px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.wbar span{display:block;height:100%;background:var(--green)}
.gq{font-family:"Gowun Dodum",sans-serif;font-size:24px;line-height:1.5}
.blank{color:var(--green);font-weight:700}
.rgta{min-height:60px!important}
.road{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.rstep{border:1.5px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:2px;font-size:12.5px;color:var(--soft);min-width:0}
.rstep i{font-style:normal;font-family:var(--f-display);font-size:16px;color:var(--ink)}
.rstep b{font-family:var(--f-display);font-weight:400;font-size:14px;color:var(--ink);line-height:1.3}
.rstep.now{border:2px solid var(--green);background:color-mix(in srgb,var(--green) 8%,var(--card))}
.rstep.done{background:var(--paper);opacity:.75}
.reqs{display:grid;gap:6px}
.req{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:8px;align-items:center;font-size:14.5px}
.req .wbar{margin:0}
.req em{font-style:normal;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.req.ok span{color:var(--ok)}
.hmap{display:grid;gap:10px;margin-top:8px}
.hmrow{display:grid;gap:6px}
.hmrow>b{font-family:var(--f-display);font-weight:400;font-size:15px}
.hmcells{display:flex;flex-wrap:wrap;gap:5px}
.hm{font-size:12.5px;padding:4px 8px;border-radius:8px;border:1.5px dashed var(--line);color:var(--soft);background:transparent}
.hm.ok{border:1.5px solid var(--green);background:color-mix(in srgb,var(--green) 16%,var(--card));color:var(--ink)}
.hm.now{border:1.5px solid var(--pencil);background:color-mix(in srgb,var(--pencil) 22%,var(--card));color:var(--ink)}
.hmbar{display:grid;grid-template-columns:5.5em 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.hmbar .wbar{margin:0;height:10px}
.hmbar em{font-style:normal;font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.hmleg{display:flex;gap:6px;flex-wrap:wrap}
.sv .tok.chip.sv-v,.note .sv-v{border:2px solid var(--green);font-weight:700}
.sv .tok.chip.sv-s,.note .sv-s{border:2px solid var(--pencil);text-decoration:underline;text-underline-offset:4px}
.sv .tok.chip.sv-m,.note .sv-m{border:2px dashed var(--soft)}
.note .sv-v,.note .sv-s,.note .sv-m{padding:1px 6px;border-radius:8px}
.sv .tok:disabled{opacity:1;cursor:default}
.lec summary{cursor:pointer;font-family:var(--f-display);color:var(--green)}
.lec a.btn{text-decoration:none;display:inline-block}
@media (max-width:440px){.road{grid-template-columns:repeat(2,1fr)}.req{grid-template-columns:1fr auto}.req .wbar{grid-column:1/-1;grid-row:2}}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.lv{min-width:130px;text-align:right}
.lv b{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--green)}
.lv span{display:block;font-size:13.5px;color:var(--soft)}
.lvbar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}
.lvbar i{display:block;height:100%;background:var(--pencil)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 6px}
.wday{border:1.5px solid var(--line);border-radius:10px;text-align:center;padding:4px 0;font-size:13px;color:var(--soft)}
.wday i{display:block;font-style:normal;font-family:var(--f-display);font-size:16px;min-height:22px;color:var(--ink)}
.wday.part{border-color:var(--pencil)}
.wday.full{background:var(--pencil);border-color:var(--pencil);color:var(--pencil-ink)}
.wday.full i{color:var(--pencil-ink)}
.wday.now{outline:2px solid var(--green);outline-offset:1px}
.quests{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.quest{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:12px;background:var(--card)}
.quest.next{border:2px solid var(--green)}
.quest.done{opacity:.7;background:var(--paper)}
.qnum{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);background:var(--grid);color:var(--ink)}
.quest.next .qnum{background:var(--green);color:var(--green-ink)}
.quest.done .qnum{background:var(--pencil);color:var(--pencil-ink)}
.qbody{min-width:0}
.qbody b{font-family:var(--f-display);font-weight:400;font-size:18px}
.qmin{font-size:13px;color:var(--soft);margin-left:4px}
.qok{font-family:var(--f-display);color:var(--ok)}
.quest .btn{padding:8px 14px;font-size:16px}
.chest{margin-top:16px;border:2px dashed var(--pencil);border-radius:18px;padding:16px;text-align:center}
.chest.locked{border-color:var(--line)}
.chest.open{border-style:solid;background:color-mix(in srgb,var(--pencil) 14%,var(--card))}
.chestIcon{font-size:42px;line-height:1.2}
.chest.locked .chestIcon{filter:grayscale(1);opacity:.5}
.chest.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@media (max-width:440px){.quest{grid-template-columns:auto 1fr}.qact{grid-column:2}.lv{text-align:left;width:100%}.lv span{display:inline;margin-left:6px}}
.rulebox{line-height:1.8;font-size:16px}
.linkbtn{font:inherit;border:0;background:none;color:var(--green);text-decoration:underline;cursor:pointer;padding:0}
.built{min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;margin:10px 0;display:flex;flex-wrap:wrap;gap:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:18px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--card))}
.chip:disabled{opacity:.35}
.scene{display:grid;gap:8px;margin-top:10px}
.howto{margin:6px 0 10px;padding-left:22px;font-size:15.5px;color:var(--soft)}
.howto li{margin-bottom:2px}
.passage.story{line-height:2}
.sline{display:inline;font:inherit;font-size:18px;line-height:2;text-align:left;padding:2px 3px;border:0;border-bottom:2px dotted var(--line);border-radius:4px;background:transparent;color:var(--ink);cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sline:hover{background:var(--grid)}
.sline.circled{border-bottom:3px solid var(--green);background:color-mix(in srgb,var(--green) 18%,transparent)}
.sline.missed{border-bottom:3px solid var(--nudge);background:var(--nudge-bg)}
.sline:disabled{cursor:default}
.passage.long h4{font-family:var(--f-display);font-weight:400;font-size:18px;margin:10px 0 4px;color:var(--green)}
.flag{font-size:12px;padding:1px 6px;border-radius:999px;background:var(--nudge-bg);color:var(--nudge);white-space:nowrap}
b.hl{text-decoration:underline;text-decoration-color:var(--pencil);text-decoration-thickness:3px;text-underline-offset:4px}
.qcard{border:2px solid var(--green);border-radius:14px;padding:10px 12px;margin-top:12px;background:color-mix(in srgb,var(--green) 6%,var(--card))}
.qlabel{font-size:13.5px;color:var(--green);font-family:var(--f-display)}
.qcard .sent{margin:4px 0 0}
.tok.chip{border:1.5px solid var(--line);border-style:solid;background:var(--card);border-radius:10px;padding:3px 9px}
.clock{border:2px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;background:var(--paper)}
.clock.on{border-color:var(--green)}
.clock.met{border-color:var(--pencil)}
.clockTop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.clockLabel{font-size:15px;color:var(--soft)}
.clockNum{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--green);font-variant-numeric:tabular-nums}
.clock.met .clockNum{color:var(--pencil-ink);background:var(--pencil);border-radius:12px;padding:2px 10px;font-size:48px}
.bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:10px}
.bar span{display:block;height:100%;width:0;background:var(--green);transition:width .25s linear}
.bookname{font-family:var(--f-display);font-size:19px;margin:6px 0 0}
.btn.big{font-size:20px;padding:14px 26px}
.fin{width:100%;display:flex;gap:8px;align-items:center;font-size:15.5px;color:var(--soft)}
.steps{display:flex;gap:6px;margin-bottom:14px}
.step{flex:1;min-width:0}
.step span{display:block;height:7px;border-radius:9px;background:var(--line)}
.step em{display:block;font-style:normal;font-size:12px;color:var(--soft);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.done span{background:var(--green)}
.step.now span{background:var(--pencil)}
.step.now em{color:var(--ink);font-weight:700}
.hl{background:color-mix(in srgb,var(--pencil) 45%,transparent);padding:0 3px;border-radius:4px}
.unk{border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;margin:8px 0 14px}
.unkrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.unkrow .field{flex:1 1 120px;margin:0}
#ulist .note{margin-top:8px}
.eyebrow{color:var(--soft);font-size:14px;margin-bottom:4px}
.lead{font-size:16px;color:var(--soft);margin:6px 0 14px}
.passage{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:18px;line-height:1.85;margin:12px 0}
.passage h3{font-size:19px;margin-bottom:6px}
.btn{font:inherit;font-family:var(--f-display);font-size:17px;padding:11px 18px;border-radius:14px;border:0;cursor:pointer;background:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{font:inherit;text-align:left;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.tried{border-color:var(--nudge);background:var(--nudge-bg)}
.opt:disabled{cursor:default}
.sent{font-size:19px;line-height:2;margin:10px 0}
.tok{font:inherit;padding:2px 6px;margin:2px 1px;border-radius:8px;border:1.5px dashed transparent;background:transparent;color:var(--ink);cursor:pointer}
.tok:hover{border-color:var(--line)}
.tok.target{font-weight:700;text-decoration:underline;text-decoration-color:var(--pencil);text-decoration-thickness:3px;text-underline-offset:5px;cursor:default}
.tok.circled{border:2px solid var(--green);border-style:solid;border-radius:999px}
.tok.missed{border:2px solid var(--nudge);border-style:solid;border-radius:999px}
.note{border-radius:12px;padding:10px 14px;margin-top:12px;font-size:16px}
.note.ok{background:color-mix(in srgb,var(--ok) 12%,var(--card));border:1.5px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.note.nudge{background:var(--nudge-bg);border:1.5px solid color-mix(in srgb,var(--nudge) 45%,transparent)}
textarea.wongoji{width:100%;min-height:140px;font:inherit;font-size:19px;line-height:36px;padding:4px 12px;border-radius:12px;border:1.5px solid var(--line);color:var(--ink);resize:vertical;
  background-color:var(--card);background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 36px;background-position:0 39px}
textarea:focus-visible,button:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.rest{text-align:center;padding:26px 6px}
.rest .big{font-family:var(--f-display);font-size:54px;color:var(--green);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--soft);font-weight:400;white-space:nowrap}
.plan{display:grid;gap:10px;margin-top:10px}
.plan div{border-left:4px solid var(--line);padding:2px 0 2px 12px}
.plan div.now{border-left-color:var(--green)}
.plan b{font-family:var(--f-display);font-weight:400}
.muted{color:var(--soft);font-size:14.5px}
@media (max-width:440px){.days{grid-template-columns:repeat(5,1fr);gap:5px}.day{font-size:13px;padding:8px 2px}.passage,.sent{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1>지호 국어 훈련장</h1>
    <span class="stars" id="starCount">별 0개</span>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tabToday" aria-selected="true">오늘</button>
    <button role="tab" id="tabTrain" aria-selected="false">국어</button>
    <button role="tab" id="tabRec" aria-selected="false">부모님</button>
  </nav>
  <main id="view" class="panel"></main>
</div>

<script>
// ---------- 콘텐츠 (1~2주차) ----------
const DAYS = [
{t:"개미는 어떻게 길을 찾을까",

const BOX_DAYS = [1, 3, 7, 14, 30];

function today(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function addDays(n){ const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function wid(word){ let h = 0; for (const c of word) h = (h * 31 + c.codePointAt(0)) >>> 0; return "w" + h.toString(36); }
function saveWord(w){
  notebook[w.id] = w; try { localStorage.setItem(LS + "-words", JSON.stringify(notebook)); } catch (e) {}
  if (db) db.collection("words").doc(w.id).set(w).catch(() => {});
}
function addWord(word, meaning, example, source){
  word = String(word || "").trim(); if (!word || !meaning) return;
  const id = wid(word), old = notebook[id];
  saveWord({ id, word, meaning, example: example || (old && old.example) || "", source, box: 0, due: addDays(1), added: (old && old.added) || today(), misses: ((old && old.misses) || 0) + 1, mastered: false });
}
function dueWords(){ const t = today(); return Object.values(notebook).filter(w => !w.mastered && w.due <= t).sort((a, b) => a.due < b.due ? -1 : 1); }

  view.querySelectorAll(".opt").forEach(b => b.onclick = () => {

        const box = Math.min(BOX_DAYS.length, (w.box || 0) + 1);
        saveWord({ ...w, box, due: addDays(BOX_DAYS[Math.min(box, BOX_DAYS.length - 1)]), mastered: box >= BOX_DAYS.length });

      $("#fb").innerHTML = `<div class="note ok">${msg}</div><div class="row"><button class="btn" id="go">다음</button></div>`;
      $("#go").onclick = () => { if (S.q < S.rev.length - 1){ S.q++; renderRev(); } else next(); };
    } else {
      b.classList.add("tried"); b.disabled = true;

    }
  });
}

    const msg = e.code === "no_sample" ? "오늘 문제를 아직 준비하지 못했어요. 부모님께 알려 주세요."
      : e.code === "not_granted" ? "로그인이 풀렸어요. 페이지를 새로 열어 다시 로그인해 주세요."
      : e.code === "rate_limited" ? "잠깐 요청이 많았어요. 1~2분 뒤에 다시 눌러 주세요."
      : "문제를 만들다가 잘 안됐어요. 다시 눌러 주세요.";
    view.innerHTML = `<div class="rest"><h2>문제를 아직 못 만들었어요</h2><p class="lead">${msg}</p><div class="row" style="justify-content:center"><button class="btn" id="re">다시 만들기</button><button class="btn ghost" id="back">처음으로</button></div></div>`;
    $("#re").onclick = () => start(i); $("#back").onclick = home; return;
  }
  S = { i, d, mode: d.mode || "one", stage: 0, t0: Date.now(), q: 0,
    voc: d.voc.map(v => ({ ...v, ...shuffleOpts(v.o, v.a), first: null })),
    dq: d.dq.map(v => ({ ...v, ...shuffleOpts(v.o, v.a), condFirst: null, first: null })),
    clue: d.clue.map(v => ({ ...v, ...shuffleOpts(v.o, v.a), clueFirst: null, first: null })),
    summary1: "", summary2: "", copy: 0, keysHit: 0, fb: null, book: null };
  S.rev = dueWords().slice(0, 5).map(w => ({ id: w.id, first: null }));
  S.stages = (S.rev.length ? ["rev", "rest"] : []).concat(STAGES);
  render();
}
function next(){ S.stage++; S.q = 0; render(); }
const GROUP = { rev: "복습", voc: "단어", read: "쓰기", write: "쓰기", detail: "꼼꼼", clue: "단서", why: "단서", book: "읽기" };
function stepBar(){
  const groups = []; S.stages.forEach(st => { const g = GROUP[st]; if (g && !groups.includes(g)) groups.push(g); });
  const st = S.stages[S.stage];
  let cur;
  if (st === "end") cur = groups.length;
  else if (st === "rest") cur = groups.indexOf(GROUP[S.stages[S.stage - 1]]) + 1;
  else cur = groups.indexOf(GROUP[st]);
  return `<div class="steps">${groups.map((g, k) => `<div class="step ${k < cur ? "done" : k === cur && st !== "rest" ? "now" : ""}"><span></span><em>${k + 1} ${g}</em></div>`).join("")}</div>`;
}
function render(){
  const st = S.stages[S.stage];
  ({ rev: renderRev, voc: renderVoc, rest: renderRest, read: renderRead, write: renderWrite, detail: renderDetail, clue: renderClue, why: renderWhy, book: renderReadingStage, end: renderEnd })[st]();
  view.scrollIntoView({ block: "start", behavior: "smooth" });
}

// 2-2. 책 덮고 쓰기
function paras(t){ return String(t).split(/\n\s*\n/).map(x => `<p style="margin:0 0 10px">${esc(x.trim())}</p>`).join(""); }
function words(t){ return t.replace(/[.,!?‘’'"“”()]/g, " ").split(/\s+/).filter(w => w.length >= 2); }
function copyRate(text){
  const pw = new Set(words(S.d.p)); const cw = words(text);
  if (!cw.length) return 0;
  return cw.filter(w => pw.has(w)).length / cw.length;
}
function keyHits(text){ return S.d.key.filter(k => k.k.some(w => text.includes(w))); }
function renderWrite(){
  const second = !!S.summary1;
  view.innerHTML = stepBar() + `
    <div class="eyebrow">${S.i + 1}일 · 책 덮고 쓰기</div>
    <h2>${second ? "같은 뜻을 다른 말로 바꿔 볼까?" : MODE[S.mode].h}</h2>
    <p class="lead">${second ? "책에 있던 낱말 대신 지호가 평소에 쓰는 말로 바꿔 써요. 뜻은 그대로, 말만 지호 말로요." : MODE[S.mode].lead}</p>
    ${second ? `<p class="muted">처음 쓴 문장: ${esc(S.summary1)}</p>` : ""}
    <label for="sum" class="muted">지호의 말로 쓰기</label>
    <textarea id="sum" class="wongoji" placeholder="${esc(MODE[S.mode].ph)}"></textarea>
    <div class="row"><button class="btn" id="go" disabled>다 썼어요</button></div>
    <div id="fb"></div>`;
  const ta = $("#sum"), go = $("#go");
  ta.oninput = () => go.disabled = ta.value.trim().length < MODE[S.mode].min;
  go.onclick = () => {
    const text = ta.value.trim();
    if (!second){
      S.summary1 = text; S.copy = copyRate(text);
      if (S.copy >= 0.6){
        const n = words(text).length, m = Math.round(S.copy * n);
        $("#fb").innerHTML = `<div class="note nudge">쓴 낱말 ${n}개 중 ${m}개가 글에 있던 말 그대로예요. 뜻은 그대로 두고 지호 말로 한 번만 바꿔 볼까?</div><div class="row"><button class="btn" id="re">다른 말로 바꿔 쓰기</button></div>`;
        go.disabled = true; ta.readOnly = true;
        $("#re").onclick = renderWrite; return;
      }
    } else { S.summary2 = text; S.copy = copyRate(text); }
    feedback(text);
  };
}

`너는 초등학교 3학년 아이의 국어 요약을 봐 주는 다정한 선생님이다.

반드시 아래 JSON만 출력해. 반말로, 친근하고 구체적으로. '틀렸다' 대신 '이렇게 하면 더 좋아' 말투. 각 문장은 40자 이내.
{"stars":1에서 3 사이 정수,"good":"잘한 점 한 문장","tip":"다음에 바로 해 볼 수 있는 고칠 점 한 문장","better":"아이 문장을 아이 말투를 살려 조금만 고친 예시 한 문장"}`,

    S.fb = r;

const PRE_READINGS = {"0": {"t": "여름은 왜 덥고 겨울은 왜 추울까?", "part": "1편", "sections": [{"h": "궁금한 질문 하나", "p": "여름에는 가만히 있어도 땀이 나고, 겨울에는 손이 꽁꽁 얼어요. 똑같은 해가 일 년 내내 떠 있는데, 왜 계절마다 이렇게 다를까요? 어떤 친구는 ‘여름에는 지구가 해에 가까워져서 그래.’라고 말해요. 정말 그럴까요? 오늘은 계절이 바뀌는 까닭을 함께 알아봐요."}, {"h": "지구는 비스듬히 기울어져 있어요", "p": "지구는 팽이처럼 빙글빙글 돌면서, 일 년에 한 바퀴씩 해 둘레를 돌아요. 그런데 지구는 똑바로 서서 도는 것이 아니라 비스듬히 기울어진 채로 돌아요. 그래서 해 둘레를 도는 동안 우리나라가 해 쪽으로 기울어질 때도 있고, 해에서 먼 쪽으로 기울어질 때도 있어요. 바로 이 기울어짐이 계절을 만드는 원인이에요."}, {"h": "여름에는 해가 높이 떠요", "p": "우리나라가 해 쪽으로 기울어지는 여름에는 해가 하늘 높이 떠요. 해가 높이 뜨면 햇빛이 땅을 똑바로 내리비춰서, 좁은 땅에 많은 햇빛이 모여요. 또 여름에는 낮이 길어서 땅이 햇빛을 오랫동안 받아요. 그 결과 땅과 공기가 많이 데워져서 덥게 느껴져요."}, {"h": "겨울에는 해가 낮게 떠요", "p": "반대로 겨울에는 해가 하늘 낮은 곳에 떠요. 해가 낮으면 햇빛이 비스듬히 비춰서, 같은 양의 햇빛이 넓은 땅에 흩어져요. 게다가 겨울에는 낮이 짧고 밤이 길어요. 땅이 햇빛을 조금밖에 받지 못하니 겨울은 추운 거예요. 겨울에 그림자가 길게 늘어지는 것도 해가 낮게 떠 있기 때문이에요."}, {"h": "정리해 볼까요?", "p": "계절이 바뀌는 까닭은 지구와 해의 거리가 아니라, 지구가 기울어진 채로 해 둘레를 돌기 때문이에요. 여름에는 해가 높고 낮이 길어서 덥고, 겨울에는 해가 낮고 낮이 짧아서 추워요. 오늘 저녁에 해가 질 때 그림자 길이를 한번 관찰해 보세요. 계절이 바뀌면 그림자 길이도 바뀐답니다."}], "quiz": [{"kind": "세부", "q": "[겨울]에는 해가 하늘 어디쯤에 떠 있나요?", "o": ["낮은 곳", "높은 곳", "한가운데 똑바로 위"], "a": 0, "why": "글에서 겨울에는 해가 하늘 낮은 곳에 뜬다고 했어요."}, {"kind": "세부", "q": "[여름]에 낮과 밤의 길이는 어떤가요?", "o": ["낮이 길다", "밤이 길다", "똑같다"], "a": 0, "why": "글에서 여름에는 낮이 길어서 햇빛을 오랫동안 받는다고 했어요."}, {"kind": "원인결과", "q": "계절이 바뀌는 까닭은 무엇일까요?", "o": ["지구가 기울어진 채로 해 둘레를 돌아서", "여름에 지구가 해에 가까워져서", "겨울에 해가 작아져서"], "a": 0, "why": "글에서 해와의 거리가 아니라 지구가 기울어진 채로 돌기 때문이라고 했어요."}, {"kind": "중심", "q": "이 글의 중심 내용으로 알맞은 것은?", "o": ["계절이 바뀌는 까닭", "그림자 놀이 하는 법", "지구가 도는 속도"], "a": 0, "why": "글 전체가 여름과 겨울이 왜 다른지 설명하고 있어요."}, {"kind": "어휘", "q": "‘비스듬히’의 뜻으로 알맞은 것은?", "o": ["한쪽으로 조금 기울어지게", "아주 빠르게", "똑바로 곧게"], "a": 0, "why": "‘똑바로 서서 도는 것이 아니라 비스듬히’라고 했으니 기울어진 모양이에요."}], "theme": "계절과 날씨 (계절이 바뀌는 까닭, 비·눈·바람·구름, 일기 예보)", "goalMin": 10, "day": 1, "pre": true}, "1": {"t": "구름은 어떻게 생길까?", "part": "2편", "sections": [{"h": "구름은 무엇으로 되어 있을까요?", "p": "하늘에 둥실 떠 있는 구름은 솜사탕처럼 보여요. 하지만 구름은 솜도 연기도 아니에요. 구름은 아주아주 작은 물방울과 얼음 알갱이가 수없이 모여 있는 것이에요. 하나하나는 너무 작아서 보이지 않지만, 셀 수 없이 많이 모이면 하얗게 보여요."}, {"h": "보이지 않는 물, 수증기", "p": "빨래를 널어 두면 젖은 옷이 마르지요. 옷에 있던 물이 사라진 게 아니라, 눈에 보이지 않는 수증기가 되어 공기 속으로 날아간 거예요. 바다와 강, 땅에서도 매일 엄청나게 많은 물이 수증기가 되어 하늘로 올라가요. 수증기는 눈에 보이지 않지만, 우리 주변 공기 속에 늘 섞여 있어요."}, {"h": "위로 올라가면 차가워져요", "p": "높은 산에 오르면 산 아래보다 춥지요. 하늘도 높이 올라갈수록 기온이 낮아져요. 수증기를 품은 공기가 위로 올라가면 점점 차가워지고, 차가워진 수증기는 작은 물방울로 바뀌어요. 아주 추운 높은 곳에서는 얼음 알갱이가 되기도 해요. 이 물방울과 얼음 알갱이가 모인 것이 바로 구름이에요."}, {"h": "구름이 비가 되기까지", "p": "구름 속 작은 물방울들은 서로 부딪히며 합쳐져요. 물방울이 점점 커지면 무거워져서 더 이상 하늘에 떠 있지 못하고 땅으로 떨어져요. 이것이 비예요. 그래서 비가 오기 전에는 하얗던 구름이 짙은 회색으로 바뀌는 일이 많아요. 물방울이 커지고 많아져서 햇빛이 잘 통과하지 못하기 때문이에요."}, {"h": "정리해 볼까요?", "p": "물이 수증기가 되어 하늘로 올라가고, 위에서 차가워지면 작은 물방울이 되어 구름이 생겨요. 물방울이 커지고 무거워지면 비가 되어 다시 땅으로 내려와요. 겨울 아침에 입김을 불면 하얗게 보이는 것도 따뜻한 숨 속 수증기가 차가운 공기를 만나 작은 물방울로 바뀌었기 때문이에요. 내 입에서도 작은 구름이 만들어지는 셈이지요."}], "quiz": [{"kind": "세부", "q": "공기가 [위로 올라가면] 어떻게 되나요?", "o": ["점점 차가워진다", "점점 따뜻해진다", "아무 변화가 없다"], "a": 0, "why": "글에서 하늘은 높이 올라갈수록 기온이 낮아진다고 했어요."}, {"kind": "세부", "q": "[눈에 보이지 않는] 것은 무엇인가요?", "o": ["수증기", "구름", "입김"], "a": 0, "why": "글에서 수증기는 눈에 보이지 않는다고 했어요. 구름과 입김은 작은 물방울이라 보여요."}, {"kind": "원인결과", "q": "구름 속 물방울이 왜 비가 되어 떨어질까요?", "o": ["물방울이 커져서 무거워지니까", "구름이 바람에 찢어지니까", "해가 구름을 밀어내니까"], "a": 0, "why": "글에서 물방울이 커지면 무거워져서 떨어진다고 했어요."}, {"kind": "중심", "q": "이 글의 중심 내용으로 알맞은 것은?", "o": ["구름이 생기고 비가 되는 과정", "빨래를 빨리 말리는 방법", "높은 산에 오르는 방법"], "a": 0, "why": "글 전체가 수증기가 구름이 되고 비가 되는 과정을 설명해요."}, {"kind": "어휘", "q": "‘셀 수 없이’의 뜻으로 알맞은 것은?", "o": ["헤아릴 수 없을 만큼 아주 많이", "하나도 없이", "딱 하나만"], "a": 0, "why": "물방울이 너무 많아서 셀 수 없다는 뜻이에요."}], "theme": "계절과 날씨 (계절이 바뀌는 까닭, 비·눈·바람·구름, 일기 예보)", "goalMin": 10, "day": 2, "pre": true}, "3": {"t": "비가 될까, 눈이 될까?", "part": "3편", "sections": [{"h": "같은 구름에서 다른 것이 내려요", "p": "지난번에 구름 속 물방울이 커지면 비가 된다는 것을 알았어요. 그런데 겨울에는 같은 하늘에서 비 대신 하얀 눈이 내려요. 비와 눈은 무엇이 다를까요? 오늘은 구름에서 땅까지 내려오는 길을 따라가 봐요."}, {"h": "구름 위쪽은 아주 추워요", "p": "높은 하늘의 구름 위쪽은 한여름에도 아주 추워요. 그래서 구름 위쪽에서는 물방울보다 얼음 알갱이가 많이 생겨요. 얼음 알갱이에 수증기가 달라붙으면 육각형 모양의 눈 결정이 자라요. 눈 결정이 커지고 무거워지면 땅을 향해 떨어지기 시작해요."}, {"h": "내려오는 길의 온도가 답을 정해요", "p": "떨어지는 눈 결정이 땅으로 내려오는 길에 따뜻한 공기를 지나면 녹아서 물이 돼요. 그러면 우리는 비를 맞게 돼요. 하지만 땅 가까이까지 공기가 계속 차가우면 눈 결정이 녹지 않고 그대로 내려와요. 그것이 눈이에요. 즉 비가 될지 눈이 될지는 구름이 아니라, 떨어지는 길의 기온이 정하는 거예요."}, {"h": "진눈깨비는 무엇일까요?", "p": "가끔 비도 아니고 눈도 아닌 것이 섞여 내릴 때가 있어요. 이것을 진눈깨비라고 해요. 내려오던 눈이 땅 가까이에서 절반쯤 녹으면, 물과 얼음이 섞인 진눈깨비가 돼요. 진눈깨비가 내리는 날은 기온이 0도 가까이 오르내리는 날이 많아요."}, {"h": "정리해 볼까요?", "p": "구름 위쪽에서 생긴 눈 결정이 내려오다가 따뜻한 공기를 지나 녹으면 비, 땅까지 차가운 공기만 지나면 눈, 절반쯤 녹으면 진눈깨비가 돼요. 다음에 눈이 오면 까만 옷소매에 눈송이를 받아 보세요. 돋보기로 관찰하면 육각형 모양의 눈 결정을 볼 수 있을지도 몰라요."}], "quiz": [{"kind": "세부", "q": "땅 가까이까지 공기가 [계속 차가우면] 무엇이 내리나요?", "o": ["눈", "비", "진눈깨비"], "a": 0, "why": "글에서 땅 가까이까지 차가우면 눈 결정이 녹지 않고 그대로 내려온다고 했어요."}, {"kind": "세부", "q": "눈이 땅 가까이에서 [절반쯤 녹으면] 무엇이 되나요?", "o": ["진눈깨비", "비", "우박"], "a": 0, "why": "글에서 절반쯤 녹으면 물과 얼음이 섞인 진눈깨비가 된다고 했어요."}, {"kind": "원인결과", "q": "비가 될지 눈이 될지는 무엇이 정할까요?", "o": ["떨어지는 길의 기온", "구름의 크기", "바람의 세기"], "a": 0, "why": "글에서 구름이 아니라 떨어지는 길의 기온이 정한다고 했어요."}, {"kind": "중심", "q": "이 글의 중심 내용으로 알맞은 것은?", "o": ["비와 눈이 달라지는 까닭", "눈사람 만드는 방법", "구름의 여러 가지 모양"], "a": 0, "why": "글 전체가 같은 구름에서 비와 눈이 다르게 내리는 까닭을 설명해요."}, {"kind": "어휘", "q": "‘결정’은 이 글에서 무슨 뜻일까요?", "o": ["물이 얼어 생긴 규칙적인 모양의 알갱이", "어떤 일을 하기로 마음먹는 것", "눈이 녹은 물"], "a": 0, "why": "‘육각형 모양의 눈 결정이 자라요’라고 했으니 얼음 알갱이의 모양을 뜻해요."}], "theme": "계절과 날씨 (계절이 바뀌는 까닭, 비·눈·바람·구름, 일기 예보)", "goalMin": 10, "day": 4, "pre": true}, "5": {"t": "바람은 왜 불까?", "part": "4편", "sections": [{"h": "보이지 않는데 느껴지는 것", "p": "바람은 눈에 보이지 않아요. 하지만 나뭇잎이 흔들리고 연이 하늘로 날아오르는 것을 보면 바람이 분다는 것을 알 수 있어요. 바람은 공기가 움직이는 것이에요. 그렇다면 공기는 왜 한곳에 가만히 있지 않고 움직일까요?"}, {"h": "따뜻한 공기는 위로 올라가요", "p": "공기는 데워지면 가벼워져서 위로 올라가요. 열기구가 하늘로 떠오르는 것도 풍선 속 공기를 뜨겁게 데우기 때문이에요. 따뜻한 공기가 위로 올라가면 그 자리가 비게 되고, 옆에 있던 차가운 공기가 그 빈자리를 채우러 밀려와요. 이렇게 공기가 옆으로 움직이는 것이 바람이에요."}, {"h": "바닷가의 낮 바람", "p": "바닷가에 가면 이 원리를 잘 알 수 있어요. 햇볕이 쨍쨍한 낮에는 땅이 바닷물보다 훨씬 빨리 데워져요. 그래서 땅 위의 공기가 먼저 따뜻해져 위로 올라가요. 그 빈자리를 바다 위의 차가운 공기가 채우러 오기 때문에, 낮에는 바다에서 땅 쪽으로 바람이 불어요."}, {"h": "바닷가의 밤 바람", "p": "밤이 되면 반대로 바뀌어요. 땅은 빨리 데워지는 만큼 빨리 식어요. 바닷물은 천천히 식기 때문에 밤에는 바다 위 공기가 땅 위 공기보다 따뜻해요. 그래서 밤에는 바다 위의 따뜻한 공기가 올라가고, 땅 위의 차가운 공기가 바다 쪽으로 움직여요. 밤에는 땅에서 바다 쪽으로 바람이 부는 거예요."}, {"h": "정리해 볼까요?", "p": "바람은 공기가 데워지고 식는 정도가 장소마다 달라서 생겨요. 따뜻한 공기가 올라간 빈자리를 차가운 공기가 채우러 움직이는 것이 바람이에요. 바닷가에서는 낮에는 바다에서 땅으로, 밤에는 땅에서 바다로 바람이 불어요. 두 방향을 비교해서 기억해 두면 헷갈리지 않아요."}], "quiz": [{"kind": "세부", "q": "바닷가에서 [밤에는] 바람이 어느 쪽으로 부나요?", "o": ["땅에서 바다 쪽으로", "바다에서 땅 쪽으로", "바람이 불지 않는다"], "a": 0, "why": "글에서 밤에는 땅 위의 차가운 공기가 바다 쪽으로 움직인다고 했어요."}, {"kind": "세부", "q": "햇볕이 쨍쨍한 낮에 [더 빨리] 데워지는 것은?", "o": ["땅", "바닷물", "둘 다 똑같다"], "a": 0, "why": "글에서 낮에는 땅이 바닷물보다 훨씬 빨리 데워진다고 했어요."}, {"kind": "원인결과", "q": "따뜻한 공기가 위로 올라가면 왜 바람이 불까요?", "o": ["빈자리를 차가운 공기가 채우러 와서", "따뜻한 공기가 구름이 되어서", "해가 공기를 밀어서"], "a": 0, "why": "글에서 빈자리를 옆의 차가운 공기가 채우러 오는 것이 바람이라고 했어요."}, {"kind": "중심", "q": "이 글의 중심 내용으로 알맞은 것은?", "o": ["바람이 부는 까닭", "연을 높이 날리는 방법", "바다에서 수영하는 법"], "a": 0, "why": "글 전체가 공기가 움직여 바람이 되는 까닭을 설명해요."}, {"kind": "어휘", "q": "‘원리’의 뜻으로 알맞은 것은?", "o": ["어떤 일이 일어나는 기본 까닭이나 규칙", "바닷가의 이름", "아주 오래된 물건"], "a": 0, "why": "‘이 원리를 잘 알 수 있어요’ 뒤에 바람이 생기는 까닭이 나오니 기본 규칙을 뜻해요."}], "theme": "계절과 날씨 (계절이 바뀌는 까닭, 비·눈·바람·구름, 일기 예보)", "goalMin": 10, "day": 6, "pre": true}, "6": {"t": "내일 날씨는 어떻게 알까?", "part": "5편", "sections": [{"h": "일기 예보는 마법일까요?", "p": "텔레비전에서 ‘내일은 비가 오겠습니다.’라는 일기 예보를 들으면 우산을 챙기지요. 아직 오지 않은 내일의 날씨를 어떻게 미리 알 수 있을까요? 일기 예보는 마법이 아니라, 꼼꼼한 관찰과 계산으로 만들어져요."}, {"h": "먼저 지금 날씨를 관찰해요", "p": "일기 예보의 첫 단계는 지금 날씨를 정확히 아는 것이에요. 전국 곳곳에 있는 관측소에서는 기온, 바람의 방향과 세기, 공기 속 수증기의 양, 비가 온 양을 쉬지 않고 재요. 하늘 높이 떠 있는 기상 위성은 우주에서 구름이 어디로 움직이는지 사진을 찍어 보내요. 기상 레이더는 지금 어디에 비구름이 있는지 알려 줘요."}, {"h": "모은 자료로 예측해요", "p": "이렇게 모은 많은 자료를 아주 빠른 컴퓨터에 넣으면, 컴퓨터가 앞으로 공기와 구름이 어떻게 움직일지 계산해요. 예보관은 컴퓨터가 계산한 결과와 그동안의 경험을 함께 살펴서 내일 날씨를 예측해요. 그래서 일기 예보는 관찰한 사실을 바탕으로 앞으로의 일을 헤아리는 것이라고 할 수 있어요."}, {"h": "일기 예보가 틀릴 때도 있어요", "p": "그런데 일기 예보가 가끔 틀리기도 해요. 날씨는 수많은 공기의 움직임이 서로 얽혀서 만들어지기 때문에, 작은 변화 하나로도 결과가 달라질 수 있어요. 그래서 오늘이나 내일의 예보는 꽤 잘 맞지만, 열흘 뒤의 예보는 틀릴 가능성이  - 1개: 글에 나온 낱말의 뜻 (문맥으로 알 수 있는 것)
 보기는 3개, 짧게(25자 안팎). 정답은 글에서 확인 가능하고 하나뿐. a는 0부터 시작하는 정답 번호. why는 '글에서 ○○라고 했어요' 식으로 초3 말투 한 문장. kind는 세부/원인결과/중심/어휘 중 하나.

JSON 하나만 출력:
{"t":"이번 편 제목","part":"${prev.length + 1}편","sections":[{"h":"소제목","p":"본문"}],"quiz":[{"kind":"세부","q":"질문 [조건]","o":["보기","보기","보기"],"a":0,"why":"설명"}]}`;
  for (let tries = 0; tries < 2; tries++){
    try {
      const r = await sample.json(prompt, { modelTier: "default" });
      if (validReading(r, target)){
        r.theme = th.topic; r.goalMin = goalMin; r.day = i + 1;

  }
  throw { code: "invalid" };
}

function startQuiz(r, goalMin, minutes){
  const qs = r.quiz.slice(0, 5).map(q => ({ ...q, ...shuffleOpts(q.o, q.a), first: null }));
  let k = 0;
  const show = () => {
    const q = qs[k];
    const qHtml = esc(q.q).replace(/\[([^\]]+)\]/g, `<b class="hl">$1</b>`);
    $("#lafter").innerHTML = `
      <div class="qcard"><div class="qlabel">정독 확인 ${k + 1}/${qs.length} · 글을 덮고 풀어요</div><p class="sent">${qHtml}</p></div>
      <div class="opts">${q.o.map((o, j) => `<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div>
      <div id="qfb"></div>`;
    $("#lafter").querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const j = +b.dataset.j;
      if (q.first === null) q.first = (j === q.a);
      if (j === q.a){
        b.classList.add("right"); $("#lafter").querySelectorAll(".opt").forEach(x => x.disabled = true); $("#ltext").hidden = true;
        $("#qfb").innerHTML = `<div class="note ok">${esc(q.why)}</div><div class="row"><button class="btn" id="qn">${k < qs.length - 1 ? "다음 문제" : "다음: 책 덮고 쓰기"}</button></div>`;
        if (q.first === false && q.kind === "어휘"){ const m = (q.q.match(/[‘'"“]([^’'"”]+)[’'"”]/) || [])[1]; if (m) addWord(m, q.o[q.a], "", "긴 글: " + r.t); }
        $("#qn").onclick = () => { if (k < qs.length - 1){ k++; show(); } else afterQuiz(); };
      } else {
        b.classList.add("tried"); b.disabled = true;
        $("#qfb").innerHTML = `<div class="note nudge">헷갈렸구나. 글을 다시 열어서 답이 나온 곳을 찾아봐요.</div><div class="row"><button class="btn ghost" id="peek">글 다시 보기</button></div>`;
        $("#peek").onclick = () => { $("#ltext").hidden = false; $("#ltext").scrollIntoView({ block: "start", behavior: "smooth" }); };
      }
    });
  };
  const afterQuiz = () => {
    const score = qs.filter(q => q.first).length;
    $("#lafter").innerHTML = `
      <div class="note ${score >= 4 ? "ok" : "nudge"}">확인 문제 ${qs.length}개 중 ${score}개를 한 번에 맞혔어요. ${score >= 4 ? "꼼꼼히 읽었어요!" : "다음에는 헷갈리는 말이 나오면 한 번 더 읽어 봐요."}</div>
      <label for="say" class="muted">책 덮고 쓰기: ${esc(inWeek(READ_Q, S.i).q)}</label>
      <textarea id="say" class="wongoji" style="min-height:90px"></textarea>
      <div class="row"><button class="btn" id="ldone" disabled>다 했어요</button></div>`;
    $("#say").oninput = () => $("#ldone").disabled = $("#say").value.trim().length < 8;
    $("#ldone").onclick = () => {
      S.book = { title: r.t, part: r.part, type: "비문학", kind: "app", minutes, goalMin, quiz: score, quizN: qs.length,
        quizMiss: qs.filter(q => !q.first).map(q => q.kind), say: $("#say").value.trim(), assigned: "연재 글: " + inWeek(THEME, S.i).topic.split(" (")[0] };
      next();
    };
  };
  show();
}

function finishedBooks(){ const set = new Set(); Object.values(records).forEach(r => { if (r.book && r.book.finished) set.add(r.book.title); }); return set; }
const SPARE = { "문학": ["나는 3학년 2반 7번 애벌레", "고전 시가 활용정점 (지금 하는 교재)"], "비문학": ["어린이동아 · 소년한국일보 (어린이 신문)"] };
function resolveBook(i){
  const type = bookTypeToday(i), sched = bookToday(i), done = finishedBooks();
  let swap = ""; try { swap = localStorage.getItem(LS + "-swap-" + sched) || ""; } catch (e) {}
  const first = swap || sched;
  if (!done.has(first)) return { title: first, pulled: false };
  const later = SCHEDULE.filter(sc => sc.w[0] > weekOf(i)).map(sc => type === "비문학" ? sc.non : sc.lit);
  const pick = later.find(t => !done.has(t)) || SPARE[type].find(t => !done.has(t)) || first;
  return { title: pick, pulled: true };
}

      if (W.clueFirst === null) W.clueFirst = false;
      b.classList.add("missed");
      if (tries >= 2){ $("#fb").innerHTML = `<div class="note nudge">표시된 문장이 단서예요. 이 문장과 인물의 행동을 이어 봐요.</div>`; open(); }
      else $("#fb").innerHTML = `<div class="note nudge">이 문장은 인물이 무엇을 했는지 알려 줘요. 왜 그랬는지 알려 주는 문장을 찾아봐요.</div>`;
    }
  });
  view.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (W.first === null) W.first = (k === W.a);
    if (k === W.a){
      b.classList.add("right"); view.querySelectorAll(".opt").forEach(x => x.disabled = true);
      $("#fb2").innerHTML = `<div class="note ok">${esc(w.why)}</div><div class="row"><button class="btn" id="go">다음</button></div>`;
      $("#go").onclick = next;
    } else { b.classList.add("tried"); b.disabled = true; $("#fb2").innerHTML = `<div class="note nudge">단서 문장을 다시 읽어 봐요. 그 문장과 어울리는 까닭은 무엇일까?</div>`; }
  });
}

// 끝
function renderEnd(){
  const cnt = (arr, f) => arr.filter(x => x[f]).length;
  const rec = {
    day: S.i + 1, date: today(),
    minutes: Math.max(1, Math.round((Date.now() - S.t0) / 60000)),
    voc: cnt(S.voc, "first"), vocN: S.voc.length,
    cond: cnt(S.dq, "condFirst"), detail: cnt(S.dq, "first"), detailN: S.dq.length,
    clueTap: cnt(S.clue, "clueFirst"), clue: cnt(S.clue, "first"), clueN: S.clue.length,
    whyClue: S.why ? !!S.why.clueFirst : null, whyOk: S.why ? !!S.why.first : null,
    summary1: S.summary1, summary2: S.summary2, copyPct: Math.round(S.copy * 100),
    keys: S.keysHit, keysN: S.d.key.length, mode: S.mode, week: weekOf(S.i),
    vocMiss: S.voc.filter(v => v.first === false).map(v => v.o[v.a]), title: S.d.t, aiStars: S.fb ? (S.fb.stars | 0) : null,
    attempts: ((records[S.i] && records[S.i].attempts) || 0) + 1,
    book: S.book,
    rev: S.rev.length, revOk: S.rev.filter(r => r.first).length
  };
  const score = rec.voc / rec.vocN + rec.detail / rec.detailN + rec.clue / rec.clueN + rec.keys / rec.keysN;
  rec.stars = score >= 3.4 ? 3 : score >= 2.4 ? 2 : 1;
  const old = records[S.i];
  let saved = rec;
  if (old){
    // 다시 한 날은 첫 기록을 공식 기록으로 두고, 다시 한 결과는 따로 남김
    saved = { ...old, attempts: rec.attempts, retries: (old.retries || []).concat([{ date: rec.date, minutes: rec.minutes, stars: rec.stars, voc: rec.voc, detail: rec.detail, clue: rec.clue, copyPct: rec.copyPct, summary1: rec.summary1, readMin: rec.book ? rec.book.minutes : null }]).slice(-5) };
  }
  records[S.i] = saved; saveLocal(); updateStars(); try { autoDone("korean"); } catch (e) {}
  if (db) db.collection("sessions").doc("day" + String(rec.day).padStart(2, "0")).set(saved).catch(() => {});
  view.innerHTML = stepBar() + `<div class="rest">
    <h2>${S.i + 1}일 훈련 끝!</h2>
    <div class="big">${"★".repeat(rec.stars)}</div>
    <p class="lead">${rec.minutes}분 동안 집중했어요. 오늘 제일 잘한 건 ${
      rec.cond === rec.detailN ? "질문 속 중요한 낱말을 바로 찾은 것" :
      rec.copyPct < 40 ? "글을 지호 말로 바꿔 쓴 것" :
      rec.voc === rec.vocN ? "낱말 뜻을 정확히 고른 것" : "끝까지 해낸 것"}이에요.</p>
    <div class="row" style="justify-content:center"><button class="btn" id="go">오늘 퀘스트로</button></div></div>`;
  $("#go").onclick = () => { S = null; tab("today"); };
}

async function resetAll(){
  $("#rstAsk").innerHTML = "지우는 중…";
  records = {}; Object.keys(notebook).forEach(k => delete notebook[k]); S = null;
  try { Object.keys(localStorage).filter(k => k === LS || k.startsWith(LS + "-words") || k.startsWith(LS + "-swap-") || k.startsWith(LS + "-book-")).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  if (db){
    for (const c of ["sessions", "words"]){
      try { const snap = await db.collection(c).get(); for (const d of snap.docs) { try { await db.collection(c).doc(d.id).delete(); } catch (e) {} } } catch (e) {}
    }

}

function quizLine(rows){
  const q = rows.filter(r => r.book.kind === "app");
  if (!q.length) return "";
  const avg = Math.round(q.reduce((n, r) => n + r.book.quiz / r.book.quizN, 0) / q.length * 100);
  const kinds = {}; q.forEach(r => (r.book.quizMiss || []).forEach(k => kinds[k] = (kinds[k] || 0) + 1));
  const worst = Object.entries(kinds).sort((a, b) => b[1] - a[1])[0];
  return `<p class="muted">연재 글 정독 확인 평균 ${avg}% (목표 80% 이상)${worst ? ` · 가장 많이 틀린 유형: ${worst[0]}` : ""}</p>`;
}
function readingSummary(rows){
  const withBook = rows.filter(r => r.book);
  if (!withBook.length) return "";
  const lastWeek = Math.max(...withBook.map(r => r.week || 1));
  const wk = withBook.filter(r => (r.week || 1) === lastWeek);
  const pages = wk.reduce((n, r) => n + (r.book.pages || 0), 0), mins = wk.reduce((n, r) => n + (r.book.minutes || 0), 0), wkGoal = wk.reduce((n, r) => n + (r.book.goalMin || 10), 0);
  const nonfic = withBook.filter(r => r.book.type === "비문학").length;
  const totalMins = withBook.reduce((n, r) => n + (r.book.minutes || 0), 0), finished = [...finishedBooks()];
  return `<h2 style="margin-top:22px">책 읽기</h2>
    <table style="margin-bottom:6px"><tr><th>지표</th><th>기록</th><th>목표</th></tr>
      <tr><td>${lastWeek}주차 읽은 시간</td><td>${mins}분${pages ? ` · ${pages}쪽` : ""}</td><td>${wkGoal}분 (이번 주 목표)</td></tr>
      <tr><td>지금까지 읽은 시간</td><td>${totalMins}분</td><td>12주 약 680분</td></tr>
      <tr><td>다 읽은 책</td><td>${finished.length ? finished.map(esc).join(", ") : "아직 없음"}</td><td>12주 9권 안팎</td></tr>
      <tr><td>비문학 비율</td><td>${Math.round(nonfic / withBook.length * 100)}%</td><td>60% 안팎</td></tr></table>
    ${quizLine(withBook)}
    <div class="tbl"><table><tr><th>날</th><th>읽은 것</th><th>분</th><th>정독 확인</th><th>책 덮고 쓰기</th></tr>
      ${withBook.slice(-10).map(r => `<tr><td>${r.day}일</td><td>${r.book.kind === "app" ? "연재 글 " + esc(r.book.part || "") + "<br>" : ""}${esc(r.book.title)}</td><td>${r.book.minutes}/${r.book.goalMin || "-"}${r.book.kind === "app" && r.book.minutes < (r.book.goalMin || 10) * 0.5 ? " <span class='flag'>빠름</span>" : ""}</td><td>${r.book.kind === "app" ? `${r.book.quiz}/${r.book.quizN}${r.book.quiz <= 2 ? " <span class='flag'>확인 필요</span>" : ""}` : (r.book.to ? "~" + r.book.to + "쪽" : "-")}</td><td style="min-width:200px">${esc(r.book.say)}</td></tr>`).join("")}
    </table></div>`;
}

function eSave(parts){
  try { localStorage.setItem(ELS, JSON.stringify(ED)); } catch (e) {}
  if (!db) return; parts = parts || ["state"];
  if (parts.includes("state")) db.collection("eng").doc("state").set({ deck: ED.deck, days: ED.days, gram: ED.gram || null, syn: ED.syn || null, checks: ED.checks || [], mwT: ED.mwT || {}, at: Date.now() }).catch(() => {});
  if (parts.includes("mw")) db.collection("eng").doc("mw").set({ list: ED.mw || [], at: Date.now() }).catch(() => {});
  if (parts.includes("banks")) db.collection("eng").doc("banks").set({ gbank: ED.gbank || {}, sbank: ED.sbank || {}, at: Date.now() }).catch(() => {});
}
const E_INT = [1, 2, 4, 7, 15, 30];       // 맞힐 때마다 다음 복습까지 날 수
const NEW_PER_DAY = 7, CHECK_MAX = 30, REV_MAX = 20;
let curTab = "today";
let E = null;                               // 진행 중인 영어 세션

function eSay(text){
  try {
    const s = window.speechSynthesis; if (!s) return false;
    s.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = 0.85;
    const v = (s.getVoices() || []).find(v => /en[-_]US/i.test(v.lang)); if (v) u.voice = v;
    s.speak(u); return true;
  } catch (e) { return false; }
}
function wordInfo(w){ return ALLW().find(x => x.w === w); }
function eStats(){
  const st = { known: 0, learning: 0, mastered: 0, unseen: 0 };
  EW.forEach(x => { const d = ED.deck[x.w]; if (!d) st.unseen++; else if (d[0] >= 5) st.mastered++; else if (d[0] >= 2) st.known++; else st.learning++; });
  return st;
}
function eDayCount(){ return Object.keys(ED.days).length; }

// ---------- 화면: 영어 홈 ----------
function engHome(){
  const t = today(), did = ED.days[t], stg = eStage();
  const due = ALLW().filter(x => ED.deck[x.w] && ED.deck[x.w][1] <= t).length;
  const lastC = (ED.checks || []).slice(-1)[0], cDue = !lastC || (new Date(t) - new Date(lastC.date)) / 86400000 >= 28;
  view.innerHTML = `
    <div class="eyebrow">영어 로드맵 · 초3 겨울 → 초5 말</div>

  E = { t0: Date.now(), stage: 0, q: 0, rev: rev.map(x => ({ x, first: null })), newWords: [], checked: 0, checkKnown: 0, gitems: null, gi: 0, gramRes: [], listen: null, li: 0, rg: null };
  const stg = eStage(), dow = new Date().getDay();
  E.stages = (stg === 1 ? E_STAGES : ["rev", "new", "gram", "syn", [1, 3, 5].includes(dow) ? "read" : "listen", "rg", "end"]).filter(s => s !== "rev" || E.rev.length);

function meaningOpts(x){

  const o = [x.m, ...same.map(y => y.m)]; while (o.length < 3) o.push(pool[Math.floor(Math.random() * pool.length)].m);

async function makeListen(n){
  const r = await sample.json(`초등학교 3학년 한국 아이(영어 읽기 미국 1학년 수준, 기본 어휘 약 500개)가 들을 아주 쉬운 영어 듣기 문제 하나를 만든다.
아이의 약점: 낱말은 듣는데 전체 내용(대의)과 까닭을 놓치고, '비가 오면', '~ 후에' 같은 조건을 놓쳐 먼저 들은 정보를 고른다.
형식: 짧은 대화(2명, 4~6줄) 또는 안내 방송(4~5문장). 쉬운 낱말과 짧은 문장. 헷갈리는 짝 정보(시간·장소·물건 두 개)를 넣고, 조건(if, but, after, because)이 답을 바꾸게 만든다. 이전과 다른 생활 주제로(${n}번째).
질문 2개(한국어): 첫째는 대의(무엇에 대한 이야기/안내), 둘째는 조건 또는 까닭. 보기 3개(한국어, 짧게), 오답 하나는 조건을 놓치면 고르는 답. a는 0부터 시작하는 정답 번호.
JSON만: {"s":[{"who":"Boy|Girl|Mom|Dad|Teacher","t":"영어 문장"}],"q":[{"kind":"대의","q":"질문","o":["보기","보기","보기"],"a":0},{"kind":"조건","q":"질문","o":["보기","보기","보기"],"a":0}]}`, { modelTier: "default" });
  if (!validListen(r)) throw { code: "invalid" };
  listenGen[n] = r; try { localStorage.setItem(ELS + "-listen", JSON.stringify(listenGen)); } catch (e) {}
  return r;
}

function showLQ(){

    <div class="opts">${q.o2.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div><div id="lfb"></div>`;
  $("#lq").querySelectorAll(".opt").forEach(b => b.onclick = () => {

      $("#go").onclick = () => { if (E.li < L.l.q.length - 1){ E.li++; showLQ(); } else eNext(); };
    } else { b.classList.add("tried"); b.disabled = true; $("#lfb").innerHTML = `<div class="note nudge">한 번 더 들어 볼까요? ${q.kind === "조건" ? "if, but, after 뒤에 나오는 말을 잘 들어요." : "처음 두 문장을 잘 들어요."}</div>`; }
  });
}

function safeB(h){ return esc(String(h)).replace(/&lt;(\/?)b&gt;/g, "<$1b>"); }

      const add = ((r && r.items) || []).map(normSyn).filter(Boolean);

// ----- 독해 (2단계부터, 월·수·금) -----
const READ_LV = { 1: "미국 2학년 수준(AR 2점대), 90~120낱말", 2: "미국 3학년 수준(AR 3점대), 130~160낱말", 3: "미국 4학년 수준(AR 4점대), 180~220낱말", 4: "미국 5~6학년 수준(AR 5~6점대), 250~300낱말, 한국 중3~고1 모의고사 쉬운 지문 정도" };
function validRead(r){ try { return typeof r.t === "string" && typeof r.p === "string" && r.p.split(/\s+/).length >= 60 && Array.isArray(r.q) && r.q.length === 4 && r.q.every(q => q.q && Array.isArray(q.o) && q.o.length === 4 && Number.isInteger(q.a) && q.a >= 0 && q.a < 4 && q.why); } catch (e) { return false; } }
async function makeERead(stage){
  const r = await sample.json(`너는 한국 학생용 영어 독해 교재 집필자다. 지문 하나와 문제 4개를 만든다.
수준: ${READ_LV[stage]}. 주제: 과학·사회·역사·생활·인물 중 하나(이전과 다른 것). 내용은 사실과 맞아야 하고 지어낸 숫자는 쓰지 않는다.
학습자의 약점: 글의 처음과 끝만 잡고 가운데 내용과 까닭을 놓치며, '~하면', '~ 후에' 같은 조건을 놓친다.
그래서 원인과 결과가 분명한 설명을 넣고, 헷갈리기 쉬운 짝 정보(두 시점, 두 장소, 두 대상)를 일부러 넣는다.
문제 4개(질문과 보기는 한국어, 보기 4개, 정답 하나):
1) kind "주제": 글의 중심 내용  2) kind "세부": 짝 정보 중 조건을 정확히 읽어야 맞히는 문제, 오답 하나는 조건을 놓치면 고르는 답
3) kind "추론": 글에서 직접 말하지 않았지만 알 수 있는 것  4) kind "어휘": 글 속 낱말 하나의 문맥상 뜻
why는 '글에서 ~라고 했어요' 꼴의 근거 한 문장. a는 0부터 시작하는 정답 번호.
JSON만: {"t":"영어 제목","p":"영어 지문","q":[{"kind":"주제","q":"질문","o":["보기","보기","보기","보기"],"a":0,"why":"근거"}]}`, { modelTier: "default" });
  if (!validRead(r)) throw { code: "invalid" };
  return r;
}

  view.innerHTML = `<div class="rest"><h2>${stage}단계 점검을 준비하는 중…</h2><p class="lead">낱말, 문법, 독해를 한 번에 확인해요. 1분쯤 걸릴 수 있어요.</p></div>`;
  const pool = stage === 1 ? EW : (ED.mw || []).filter(x => x.lv === Math.min(3, stage - 1));
  const vw = (pool.length >= 15 ? pool : ALLW()).slice().sort(() => Math.random() - .5).slice(0, 15);
  const range = stage === 1 ? UNITS : MUNITS.slice((stage - 2) * 6, (stage - 1) * 6);
  const us = range.slice().sort(() => Math.random() - .5).slice(0, 5);
  for (const u of us) if (u.ai) await ensureBank(u, 2);
  const gi = us.flatMap(u => mkItems(u, 2)).filter(x => x.t === "ch").slice(0, 10);
  let rd = null; if (sample){ try { rd = await makeERead(stage); } catch (e) {} }
  const C = { stage, i: 0, items: [] };
  vw.forEach(x => { const s = meaningOpts(x); C.items.push({ area: "어휘", q: x.w, o: s.o, a: s.a }); });

  if (rd) rd.q.forEach(q => { const s = shuffleOpts(q.o, q.a); C.items.push({ area: "독해", q: q.q, o: s.o, a: s.a, p: rd }); });
  const next = () => {
    if (C.i >= C.items.length){
      const by = a => { const xs = C.items.filter(x => x.area === a); return xs.length ? Math.round(xs.filter(x => x.ok).length / xs.length * 100) : null; };
      const rec = { date: today(), stage, voc: by("어휘"), gram: by("문법"), read: by("독해") };

      const ready = [rec.voc, rec.gram, rec.read].every(v => v === null || v >= 80);

        <p class="lead">${ready ? "이 단계 내용을 대부분 알고 있어요. 남은 구멍만 채우면 다음 단계예요." : "80%가 안 된 영역이 지금 채울 구멍이에요. 매일 훈련에서 그 부분이 더 자주 나와요."}</p>
        <div class="row" style="justify-content:center"><button class="btn" id="go">영어 홈으로</button></div></div>`;
      $("#go").onclick = engHome; return;
    }
    const it = C.items[C.i];
    view.innerHTML = `<div class="eyebrow">${stage}단계 점검 · ${C.i + 1}/${C.items.length} · ${it.area}</div>
      ${it.p && it === C.items.find(x => x.p) ? `<div class="passage"><h3>${esc(it.p.t)}</h3>${paras(it.p.p)}</div>` : it.p ? `<details class="swap"><summary class="muted">지문 다시 보기</summary><div class="passage">${paras(it.p.p)}</div></details>` : ""}
      <h2 class="${it.area === "어휘" ? "eword" : "gq"}">${it.area === "문법" ? esc(it.q).replace("(____)", "<span class='blank'>(　　)</span>") : esc(it.q)}</h2>
      <p class="muted">점검은 한 번만 골라요. 모르면 가장 그럴듯한 것을 골라요.</p>
      <div class="opts">${it.o.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
    view.querySelectorAll(".opt").forEach(b => b.onclick = () => { it.ok = +b.dataset.k === it.a; C.i++; next(); });

      kGate("", true); let done = false;
      AU.onAuthStateChanged(FBK.auth, u => {
        FBK.user = u; if (!u){ kGate(""); return; } if (!window.claude && window.AI_URL && !sample) sample = aiShim();
        const g = document.getElementById("kgate"); if (g) g.innerHTML = "";
        if (done) return; done = true;
        const em = u.email.toLowerCase(), pre = "kor~" + em + "~", ref = (c, id) => FS.doc(FBK.db, "progress", pre + c + "~" + id);
        const clean = d => { const o = { ...d }; delete o._k; return o; };
        resolve({ collection: c => ({
          doc: id => ({
            set: d => FS.setDoc(ref(c, id), { ...JSON.parse(JSON.stringify(d)), _k: pre + c }),
            get: () => FS.getDoc(ref(c, id)).then(s => ({ exists: s.exists(), data: () => clean(s.data() || {}) }))
          }),
          onSnapshot: (cb, err) => FS.onSnapshot(FS.query(FS.collection(FBK.db, "progress"), FS.where("_k", "==", pre + c)), s => cb({ docs: s.docs.map(d => ({ id: d.id, data: () => clean(d.data()) })) }), e => { if (e && e.code === "permission-denied") kGate(u.email + " 계정은 가족 목록에 없어요."); if (err) err(e); })
        }) });
      });
    } catch (e) { const g = document.getElementById("kgate"); if (g) g.innerHTML = ""; resolve(null); }
  });
}

// ---------- 저장소 · 선생님 한마디 연결 ----------
(async () => {
  try {
    if (window.claude && window.claude.use) sample = await claude.use("sample");
  } catch (e) { sample = null; }
  // 다음 훈련일의 문제와 연재 글을 미리 만들어 두기 (기다리지 않게)
  setTimeout(async () => {
    if (!sample) return;
    let n = 0; while (records[n] && n < TOTAL - 1) n++;
    for (const i of [n, n + 1]){
      if (i >= TOTAL) break;
      try { if (i >= DAYS.length && !genDays[i]) await makeDay(i); } catch (e) { return; }
      try { if (bookTypeToday(i) === "비문학" && !readings[i]) await makeReading(i); } catch (e) { return; }
    }
  }, 4000);
  try {
    db = await fireDB();
    if (db){
      const timer = setTimeout(() => {}, 10000);
      db.collection("sessions").onSnapshot(snap => {
        clearTimeout(timer);
        snap.docs.forEach(d => { const r = d.data(); if (r && r.day) { const i = r.day - 1; if (!records[i] || (records[i].attempts || 0) <= (r.attempts || 0)) records[i] = r; } });
        saveLocal(); updateStars();
        if (!S){ if (curTab === "rec") { recView(); bindQuestParent(); } else if (curTab === "train") home(); else if (curTab === "today") todayView(); }
      }, () => clearTimeout(timer));
      db.collection("words").onSnapshot(snap => {
        snap.docs.forEach(d => { const v = d.data(); if (v && v.id){ const old = notebook[v.id]; if (!old || (v.box || 0) !== (old.box || 0) || v.due !== old.due) notebook[v.id] = v; } });
        try { localStorage.setItem(LS + "-words", JSON.stringify(notebook)); } catch (e) {}
      }, () => {});
      db.collection("quest").doc("state").get().then(d => {
        const v = d.exists ? d.data() : null;
        if (v && v.days && (v.at || 0) > 0 && Object.keys(v.days).length >= Object.keys(QD.days).length){ QD = { days: v.days, cfg: { ...QD.cfg, ...(v.cfg || {}) } }; if (QD.cfg.koOnly !== 1) QD.cfg = { ...QD.cfg, math: false, koOnly: 1 }; try { localStorage.setItem(QLS, JSON.stringify(QD)); } catch (e) {} updateStars(); if (curTab === "today") todayView(); }
      }).catch(() => {});
      db.collection("eng").doc("state").get().then(d => {
        const v = d.exists ? d.data() : null;
        if (v && v.days && Object.keys(v.days).length > Object.keys(ED.days).length){ ED = { ...ED, deck: v.deck || {}, days: v.days, gram: v.gram || ED.gram, syn: v.syn || ED.syn, checks: v.checks || ED.checks, mwT: v.mwT || ED.mwT }; try { localStorage.setItem(ELS, JSON.stringify(ED)); } catch (e) {} if (curTab === "eng" && !E) engHome(); }
      }).catch(() => {});
      db.collection("eng").doc("mw").get().then(d => { const v = d.exists ? d.data() : null; if (v && Array.isArray(v.list) && v.list.length > (ED.mw || []).length){ ED.mw = v.list; try { localStorage.setItem(ELS, JSON.stringify(ED)); } catch (e) {} } }).catch(() => {});
      db.collection("eng").doc("banks").get().then(d => { const v = d.exists ? d.data() : null; if (v){ ED.gbank = { ...(v.gbank || {}), ...(ED.gbank || {}) }; ED.sbank = { ...(v.sbank || {}), ...(ED.sbank || {}) }; } }).catch(() => {});
      db.collection("readings").onSnapshot(snap => {
        snap.docs.forEach(d => { const v = d.data(); if (v && v.day && !readings[v.day - 1]) readings[v.day - 1] = v; });
        saveReadingsLocal();
      }, () => {});
      db.collection("days").onSnapshot(snap => {
        snap.docs.forEach(d => { const v = d.data(); if (v && v.day && !genDays[v.day - 1]) genDays[v.day - 1] = v; });
        saveDaysLocal();
      }, () => {});
    }
  } catch (e) { db = null; }
})();
</script>
